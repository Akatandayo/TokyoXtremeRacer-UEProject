  <section id="s-online" class="screen">
    <div class="topbar"><span class="tt">オンライン対戦</span><button class="btn btn-ghost" id="online-back" style="width:auto">戻る</button></div>
    <p class="note">同じ「あいことば」を入れた2人がつながります。片方が部屋を作り、もう片方が参加してください。</p>
    <div class="h-rule">あいことば</div>
    <input type="text" id="net-word" placeholder="例：しろよる" autocomplete="off">
    <div class="h-rule">使うキャラクター</div>
    <div class="glass preview" id="online-preview"></div>
    <div class="tray" id="online-tray"></div>
    <div style="height:8px"></div>
    <button class="btn btn-gold" id="btn-connect">あいことばでつながる</button>
    <div style="height:9px"></div>
    <button class="btn btn-ghost" id="btn-cancel-net" style="display:none">接続をやめる</button>
    <div style="height:12px"></div>
    <div class="status" id="net-status" style="display:none"></div>
    <p class="note" style="margin-top:10px">二人とも同じあいことばを入れて、このボタンを押すだけです。先に押した方が待ち受け、あとから押した方が合流します。</p>
  </section>
