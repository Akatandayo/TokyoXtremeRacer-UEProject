<div class="shockwave" id="shockwave"></div>
<div class="hitflash" id="hitflash"></div>
<div class="awk" id="awk" aria-hidden="true">
  <div class="awk-void"></div>
  <div class="awk-ink"></div>
  <div class="rays"></div>
  <div class="awk-ring"></div>
  <div class="awk-ring r2"></div>
  <div class="awk-stage">
    <div class="awk-fig" id="awk-sil" aria-hidden="true"></div>
    <div class="awk-fig now" id="awk-fig"></div>
    <div class="awk-shards"><i style="--r:-58deg"></i><i style="--r:-22deg"></i><i style="--r:14deg"></i><i style="--r:46deg"></i><i style="--r:88deg"></i><i style="--r:126deg"></i></div>
  </div>
  <div class="awk-motes"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="awk-slash s1"></div>
  <div class="awk-slash s2"></div>
  <div class="awk-core">
    <div class="awk-form" id="awk-form"></div>
    <div class="big"><i>覚</i><i>醒</i></div>
    <div class="who2" id="awk-who"></div>
  </div>
  <div class="awk-bar t"></div>
  <div class="awk-bar b"></div>
  <button class="awk-skip" id="awk-skip">スキップ ▸</button>
</div>
<div class="decide" id="decide" aria-hidden="true">
  <div class="dc-dim"></div>
  <div class="dc-word" id="decide-word"><span></span></div>
  <div class="dc-sub" id="decide-sub"></div>
  <div class="dc-rule"></div>
</div>
