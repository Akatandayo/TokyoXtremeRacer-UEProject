<div class="cropper" id="cropper">
  <div class="crop-panel">
    <div class="crop-head">切り抜く範囲を決める</div>
    <p class="crop-lead">指でずらす／2本指でつまんで拡大／2回たたくと元に戻ります</p>
    <div class="crop-box" id="crop-box">
      <img id="crop-img" alt="切り抜く画像">
      <div class="crop-grid" aria-hidden="true"></div>
      <div class="crop-busy" id="crop-busy"></div>
    </div>
    <div class="crop-zoomrow">
      <span>拡大</span>
      <input type="range" id="crop-zoom" min="100" max="400" value="100" aria-label="拡大率">
      <button class="btn btn-ghost" id="crop-reset" style="width:auto;padding:10px 12px">戻す</button>
    </div>
    <div class="crop-size" id="crop-size"></div>
    <div class="rowbtns">
      <button class="btn btn-line" id="crop-cancel">やめる</button>
      <button class="btn btn-gold" id="crop-ok">これで決定</button>
    </div>
  </div>
</div>
