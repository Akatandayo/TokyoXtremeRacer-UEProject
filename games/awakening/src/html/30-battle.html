  <section id="s-battle" class="screen">
    <div class="hud">
      <span class="pill turn" id="turn-label">ターン 1</span>
      <span class="pill rcmark" id="rc-mark" hidden title="レギュレーション戦">RC</span>
      <span class="pill phase" id="phase-label"></span>
      <span class="hud-tools">
        <button class="tool" id="btn-speed" aria-label="演出の速さを変える"><span class="ti">⏩</span><span class="tl">はやい</span></button>
        <button class="tool" id="btn-mute" aria-label="音の入り切り"><span class="ti">♪</span><span class="tl">ON</span></button>
      </span>
    </div>
    <div class="arena" id="arena">
      <div class="stage" aria-hidden="true">
        <div class="sky"></div>
        <div class="moon"></div>
        <div class="ridge"></div>
        <div class="torii"></div>
        <div class="hline"></div>
        <div class="floor"></div>
        <div class="embers"><i></i><i></i><i></i></div>
        <div class="vig"></div>
      </div>
      <div class="arena-glow" id="arena-glow"></div>
      <div class="plate foe" id="plate1"></div>
      <div class="field" id="field">
        <div class="unit foe" id="view1"></div>
        <div class="unit me" id="view0"></div>
      </div>
      <div class="plate me" id="plate0"></div>
    </div>
    <div class="logrow">
      <button class="logstrip" id="logstrip" aria-label="戦闘ログ。再生中はタップで早送り"></button>
      <button class="loghist" id="btn-loghist" aria-label="戦闘ログの履歴を開く"><span>履</span><span>歴</span></button>
    </div>
    <div class="dock" id="cmd-area"></div>
    <div class="ffcatch" id="ffcatch" aria-hidden="true"></div>
  </section>
