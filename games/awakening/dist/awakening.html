/* ===== 13c-ui-net.js ===== */
/* ===== UI：オンライン対戦 ===== */
Object.assign(UI, {
  /* ---------- オンライン ---------- */
  openOnline(){
    const list=Object.values(CHARACTERS);
    if(!this.onlinePick||!CHARACTERS[this.onlinePick]) this.onlinePick=list[0].id;
    $("#online-preview").innerHTML=this.previewCard(CHARACTERS[this.onlinePick]);
    const tray=$("#online-tray");
    tray.innerHTML=this.trayHtml(list,this.onlinePick);
    tray.querySelectorAll(".thumb").forEach(b=>b.onclick=()=>{ this.onlinePick=b.dataset.id; this.openOnline(); });
    this.show("online");
  },
  netStatus(text,cls){
    const el=$("#net-status");
    el.style.display="block"; el.className="status "+(cls||""); el.innerHTML=text;
  },
  netBusy(on){
    $("#btn-connect").disabled=on;
    $("#btn-connect").textContent=on?"接続中…":"あいことばでつながる";
    $("#btn-cancel-net").style.display=on?"block":"none";
  },
  /* 相手の端末に無い自作技も一緒に渡す。相手のデータは書き換えない */
  bundleFor(charId){
    const c=CHARACTERS[charId];
    const o=JSON.parse(JSON.stringify(c));
    if(o.bgmAudio&&o.bgmAudio.length>300000){ delete o.bgmAudio; delete o.bgmAudioName; }
    const ids=[].concat(o.skills||[],(o.awakening&&o.awakening.form&&o.awakening.form.skills)||[]);
    const skills={};
    ids.forEach(id=>{ if(SKILLS[id]) skills[id]=SKILLS[id]; });
    return {v:APP_VERSION, char:o, skills};
  },
  battleSkills(b1,b2){
    return Object.assign({},(b1&&b1.skills)||{},(b2&&b2.skills)||{});
  },

  connect(){
    const word=$("#net-word").value.trim();
    if(!word){ this.netStatus("あいことばを入れてください。","bad"); return; }
    this.mode="online"; this.netStarted=false; this.mySide=0;
    Music.unlock();          // 開戦は相手の到着時なので、ここで音を開通させておく
    this.netBusy(true);
    Net.start(word,{
      onStatus:s=>this.netStatus(s.text,s.cls),
      onRole:role=>{ this.mySide=(role==="host")?0:1; },
      onConnect:role=>{
        this.netStatus("つながりました。キャラクターを送っています…","ok");
        if(role==="guest") Net.send({t:"hello",bundle:this.bundleFor(this.onlinePick)});
        else Net.send({t:"hello-req"});
      },
      onData:d=>this.onNetData(d),
      onClose:()=>this.onNetClose()
    });
  },
  cancelNet(){
    Net.close(); this.netBusy(false);
    this.netStatus("接続をやめました。","");
  },
  onNetClose(){
    this.stopResend();
    this.netBusy(false);
    if($("#s-battle").classList.contains("on")||$("#s-result").classList.contains("on")){
      this.openOnline();
      this.netStatus("相手との接続が切れました。もう一度同じあいことばでつなぎ直せます。","bad");
    }else{
      this.netStatus("接続が切れました。もう一度お試しください。","bad");
    }
  },
  onNetData(d){
    if(!d||!d.t) return;
    if(d.t==="hello-req"){ Net.send({t:"hello",bundle:this.bundleFor(this.onlinePick)}); return; }
    if(d.t==="hello"){
      if(Net.role!=="host"||this.netStarted) return;
      if(d.bundle&&d.bundle.v&&d.bundle.v!==APP_VERSION){
        this.netStatus(`相手のアプリの版が違います（相手 ${esc(d.bundle.v)} / あなた ${APP_VERSION}）。同じファイルを使ってください。`,"bad");
        return;
      }
      this.netStarted=true;
      const seed=Math.floor(Math.random()*4294967296);
      const mine=this.bundleFor(this.onlinePick);
      Net.send({t:"start",seed,bundles:[mine,d.bundle]});
      this.beginOnlineBattle([mine,d.bundle],seed);
      return;
    }
    if(d.t==="start"){
      this.netStarted=true;
      this.beginOnlineBattle(d.bundles,d.seed);
      return;
    }
    if(d.t==="need-act"){
      // 相手がこちらの行動を受け取れていない。控えから送り直す
      const a=this.sentActions&&this.sentActions[d.turn];
      if(a) Net.send({t:"act",turn:d.turn,action:a});
      return;
    }
    if(d.t==="act"){
      const side=1-this.mySide;
      if(!this.engine) return;
      if(d.turn<this.engine.turn) return;                    // 済んだターンの重複は捨てる
      if(d.turn!==this.engine.turn||this.acted[side]) this.remoteBuf[d.turn]=d.action;
      else this.submitSide(side,d.action);
      return;
    }
    if(d.t==="rematch-req"){
      if(Net.role!=="host") return;
      const seed=Math.floor(Math.random()*4294967296);
      Net.send({t:"rematch",seed});
      this.beginOnlineBattle(this.bundles,seed);
      return;
    }
    if(d.t==="rematch"){ this.beginOnlineBattle(this.bundles,d.seed); return; }
  },
  beginOnlineBattle(bundles,seed){
    if(!bundles||!bundles[0]||!bundles[1]) return;
    this.bundles=bundles;
    this.chars=[bundles[0].char,bundles[1].char];
    this.controllers=this.mySide===0?["local","remote"]:["remote","local"];
    this.remoteBuf={}; this.sentActions={};
    this.stopResend();
    this.netBusy(false);
    this.startBattle(this.chars[0],this.chars[1],seed,this.battleSkills(bundles[0],bundles[1]));
  },
  /* 通信が一度こぼれても止まらないよう、相手の行動が来るまで自分の行動を送り直す */
  startResend(){
    if(this.resendTimer) return;
    this.resendTimer=setInterval(()=>{
      if(this.mode!=="online"||!this.engine||this.engine.over) return this.stopResend();
      if(this.playing) return;
      const me=this.mySide, foe=1-me, t=this.engine.turn;
      if(this.acted[me]&&!this.acted[foe]){
        const mine=this.sentActions&&this.sentActions[t];
        if(mine) Net.send({t:"act",turn:t,action:mine});   // 自分の分が落ちていた場合
        Net.send({t:"need-act",turn:t});                   // 相手の分が落ちていた場合
      }
      if(Net.quiet()) $("#phase-label").textContent="相手と通信できていません…";
    },1800);
  },
  stopResend(){ if(this.resendTimer){ clearInterval(this.resendTimer); this.resendTimer=null; } },
});

/* ===== 13d-ui-battle.js ===== */
/* ===== UI：戦闘画面と結果 ===== */
Object.assign(UI, {
  /* ---------- 戦闘開始 ---------- */
  startLocalOrAi(){
    Music.unlock();
    this.mySide=0;
    this.controllers=this.mode==="ai"?["local","ai"]:["local","local"];
    this.chars=[CHARACTERS[this.pick[0]],CHARACTERS[this.pick[1]]];
    this.startBattle(this.chars[0],this.chars[1],null,null);
  },
  applyPrefs(){
    if(this.SPEEDS[Store.prefs.speed]) this.speed=Store.prefs.speed;
    Music.setMuted(!!Store.prefs.muted);
    this.syncSpeed(); this.syncMute();
  },
  startBattle(charA,charB,seed,skills){
    const opts={};
    if(seed!=null) opts.seed=seed;
    if(skills) opts.skills=skills;
    this.engine=new BattleEngine(charA,charB,opts);
    this.acted=[false,false];
    this.prevSnap=this.engine.log[0].snap;
    this.renderFighters();
    this.strip(this.engine.log.slice(-2));
    this.show("battle");
    this.applyPrefs();
    this.playBgm();
    this.beginInput();
  },

  /* 対戦相手のキャラクターに設定された曲を流す */
  playBgm(){
    const foe=this.chars[1-this.mySide]||{}, mine=this.chars[this.mySide]||{};
    const pick = (foe.bgmAudio||(foe.bgm&&foe.bgm!=="none")) ? foe : mine;
    Music.play(pick.bgm, pick.bgmAudio);
    this.syncMute();
    setTimeout(()=>this.syncMute(),400);
  },
  syncMute(){
    const b=$("#btn-mute");
    if(!b) return;
    if(Music.muted) b.textContent="♪ OFF";
    else b.textContent=Music.blocked()?"♪ タップ":"♪ ON";
  },
  /* 画面を触ったら、鳴らせずに待っていた曲を拾う */
  nudgeMusic(){
    if(Music.muted) return;
    if(Music.blocked()||!Music.key){ Music.unlock(); }
    this.syncMute();
    setTimeout(()=>this.syncMute(),350);
  },
  toggleMute(){
    Music.setMuted(!Music.muted);
    Store.prefs.muted=Music.muted; Store.savePrefs();
    if(!Music.muted&&!Music.key&&$("#s-battle").classList.contains("on")) this.playBgm();
    this.syncMute();
  },
  syncSpeed(){
    const b=$("#btn-speed");
    if(b) b.textContent="⏩ "+this.SPEEDS[this.speed].label;
  },
  cycleSpeed(){
    const keys=Object.keys(this.SPEEDS);
    this.speed=keys[(keys.indexOf(this.speed)+1)%keys.length];
    Store.prefs.speed=this.speed; Store.savePrefs();
    this.syncSpeed();
  },

  /* ---------- 盤面 ---------- */
  sideOf(view){ return view===0 ? this.mySide : 1-this.mySide; },
  ownerLabel(side){
    if(this.mode==="local") return "プレイヤー"+(side+1);
    if(this.mode==="ai") return side===this.mySide?"あなた":"AI（"+AI.LEVELS[this.aiLevel].label+"）";
    return side===this.mySide?"あなた":"相手";
  },
  renderFighters(snap,turn){
    const e=this.engine;
    [0,1].forEach(view=>{
      const side=this.sideOf(view);
      const f=e.fighters[side];
      const s=snap?snap[side]:e.snapshot()[side];
      const pct=Math.max(0,s.hp/s.maxHp*100);
      const awake=s.form==="AWAKENED";
      const host=$("#view"+view);
      host.className="unit"+(view===1?" foe":"");
      const chips=s.effects.map(x=>{
        const d=x.duration>=BALANCE.permanentDuration?"∞":(x.duration>1?x.duration:"");
        return `<span class="chip ${effTone(x)}"><span class="ci">${effIcon(x)}</span>${esc(x.name)}${d?" "+d:""}</span>`;
      }).join("");
      const pips=Array.from({length:BALANCE.sp.max},(_,k)=>`<span class="pip${k<s.sp?" on":""}"></span>`).join("");
      host.innerHTML=`
        <div class="avwrap">${this.avatar(f,"84",(view===1?"foe":"me")+(awake?" awake":""))}</div>
        <div class="info">
          <span class="owner">${esc(this.ownerLabel(side))}</span>
          <div class="nmrow"><span class="nm">${esc(f.name)}</span>
            ${awake?`<span class="badge b-gold">${esc(s.formName||"覚醒")}</span>`:""}
            ${s.awaken==="AVAILABLE"?`<span class="badge b-gold b-pulse">覚醒可能</span>`:""}
            ${s.defending?`<span class="badge b-jade">防御</span>`:""}
          </div>
          <div class="hpline">
            <div class="hpbar">
              <div class="hpghost" style="width:${pct}%"></div>
              <div class="hpfill${awake?" awake":""}${pct<=30?" low":""}" style="width:${pct}%"></div>
            </div>
            <div class="hpnum"><span>HP</span><span><b>${s.hp}</b> / ${s.maxHp}</span></div>
          </div>
          <div class="spbar">${pips}</div>
          ${chips?`<div class="chips">${chips}</div>`:""}
        </div>`;
    });
    $("#turn-label").textContent="ターン "+(turn||this.engine.turn);
  },
  popNumber(view,delta,crit){
    const host=$("#view"+view);
    const wrap=host.querySelector(".avwrap");
    if(!wrap) return;
    const d=document.createElement("div");
    d.className="float"+(delta>0?" heal":"")+(crit?" crit":"");
    d.textContent=(delta>0?"+":"−")+Math.abs(delta);
    wrap.appendChild(d);
    setTimeout(()=>d.remove(),1100);
    if(delta<0){
      host.classList.remove("hurt"); void host.offsetWidth; host.classList.add("hurt");
      setTimeout(()=>host.classList.remove("hurt"),450);
    }
  },
  actAnim(side){
    if(side==null) return;
    const host=$("#view"+(side===this.mySide?0:1));
    host.classList.remove("act"); void host.offsetWidth; host.classList.add("act");
    setTimeout(()=>host.classList.remove("act"),520);
  },

  /* ---------- 入力 ---------- */
  beginInput(){
    if(this.engine.over) return;
    this.acted=[false,false];
    $("#phase-label").textContent="";
    this.localSides=[0,1].filter(s=>this.controllers[s]==="local");
    this.li=0;
    [0,1].forEach(s=>{
      if(this.controllers[s]==="ai"){
        setTimeout(()=>{ if(this.engine&&!this.acted[s]&&!this.engine.over)
          this.submitSide(s,AI.choose(this.engine,s,this.aiLevel)); },700);
      }
      if(this.controllers[s]==="remote"){
        const buf=this.remoteBuf[this.engine.turn];
        if(buf){ delete this.remoteBuf[this.engine.turn]; this.submitSide(s,buf); }
      }
    });
    if(this.mode==="online") this.startResend();
    this.nextLocal();
  },
  nextLocal(){
    if(this.li>=this.localSides.length){ this.waitRemote(); return; }
    const side=this.localSides[this.li];

      $("#veil-title").textContent=`プレイヤー${side+1} の番`;

      <button class="cbtn" data-cmd="DEFEND"><span class="ci">⛊</span><span class="cl">防御</span></button>

      ${o.canAwaken?`<button class="cbtn wide awaken" data-cmd="AWAKEN"><span class="cl">覚 醒</span></button>`:""}
    </div>`;
    area.querySelectorAll("[data-cmd]").forEach(b=>{
      b.onclick=()=>{

  openSheet(title,html){

  },
  closeSheet(){
    $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on");
  },
  skillCardHtml(x,i){
      const s=x.skill;
      const meta=[`<span class="mchip">${TYPE_LABEL[s.type]||"技"}</span>`];
      if(s.power>0) meta.push(`<span class="mchip">威力 ${s.power}${s.hits>1?"×"+s.hits:""}</span>`);
      meta.push(`<span class="mchip">命中 ${s.accuracy}%</span>`);
      if(s.priority) meta.push(`<span class="mchip hot">優先度 ${s.priority}</span>`);
      if(s.guardBreak) meta.push(`<span class="mchip hot">防御貫通</span>`);
      if(s.buffPierce) meta.push(`<span class="mchip hot">バフ貫通</span>`);
      if(s.healPercent) meta.push(`<span class="mchip">回復 ${s.healPercent}%</span>`);
      if(s.drain) meta.push(`<span class="mchip">吸収 ${Math.round(s.drain*100)}%</span>`);
      if(s.varyPercent) meta.push(`<span class="mchip">ばらつき ±${s.varyPercent}%</span>`);
      if(s.costMax) meta.push(`<span class="mchip hot">SP1ごとに威力+${s.powerPerSp||0}${s.durationPerSp?" 持続+"+s.durationPerSp:""}</span>`);
      (s.effects||[]).forEach(e=>meta.push(`<span class="mchip">${effIcon(e)} ${esc(e.name)}${e.chance!=null?" "+Math.round(e.chance*100)+"%":""}</span>`));
      const costText=x.usable
        ? ("SP "+(x.variable?s.cost+"〜"+s.costMax:s.cost)+(x.reason?" ／ "+x.reason:""))
        : x.reason;
      return `<button class="skl t-${s.type}" data-i="${i}" ${x.usable?"":"disabled"}>
        <span class="top"><span class="snm">${esc(s.name)}</span>
        <span class="cost${x.usable?"":" no"}">${costText}</span></span>
        <div class="sds">${esc(s.description||"")}</div>
        <div class="meta">${meta.join("")}</div></button>`;
  },
  openSkills(side){
    const o=this.engine.options(side);
    const html=`<div class="skill-list">`+o.skills.map((x,i)=>this.skillCardHtml(x,i)).join("")+`</div>`;
    this.openSheet("技をえらぶ",html);
    $("#sheet-body").querySelectorAll(".skl").forEach(b=>{
      b.onclick=()=>{
        const x=o.skills[+b.dataset.i];
        if(x.variable&&x.maxSpend>x.skill.cost) this.chooseSpend(side,x);
        else { this.closeSheet(); this.choose(side,{type:"SKILL",skillId:x.skill.id}); }
      };
    });
  },
  /* 可変SPの技：いくら注ぎ込むかを選ぶ */
  chooseSpend(side,x){
    const me=this.engine.fighters[side], foe=this.engine.foe(side);
    const list=[];
    for(let sp=x.skill.cost; sp<=x.maxSpend; sp++){
      const eff=BattleEngine.effectiveSkill(x.skill,sp);
      const dmg=Math.round(this.engine.preview(me,foe,eff));
      list.push(`<button class="skl t-${x.skill.type}" data-sp="${sp}">
        <span class="top"><span class="snm">SP ${sp} で放つ</span>
        <span class="cost">${dmg>0?"期待 "+dmg:"効果強化"}</span></span>
        <div class="meta">${eff.power?`<span class="mchip">威力 ${eff.power}${eff.hits>1?"×"+eff.hits:""}</span>`:""}
        ${(eff.effects||[]).map(e=>`<span class="mchip">${effIcon(e)} ${esc(e.name)} ${e.duration}T</span>`).join("")}
        <span class="mchip">残SP ${me.sp-sp}</span></div></button>`);
    }
    this.openSheet(x.skill.name+"：SPを決める",
      `<div class="skill-list">${list.join("")}</div>
       <div style="height:9px"></div><button class="btn btn-line" id="spend-back">技をえらび直す</button>`);
    $("#sheet-body").querySelectorAll("[data-sp]").forEach(b=>{
      b.onclick=()=>{ this.closeSheet(); this.choose(side,{type:"SKILL",skillId:x.skill.id,spend:+b.dataset.sp}); };
    });
    $("#spend-back").onclick=()=>this.openSkills(side);
  },
  openInfo(side){
    const f=this.engine.fighters[side], a=f.char.awakening;
    const st=["atk","def","spd"].map(k=>`<span class="mchip">${k.toUpperCase()} ${Effects.stat(f,k)}</span>`).join("");
    let aw="覚醒なし";
    if(a&&a.enabled){
      const state={LOCKED:"条件未達成",AVAILABLE:"いつでも覚醒できる",ACTIVE:`覚醒中（残り${f.awaken.turnsLeft}ターン）`,SPENT:"使用済み"}[f.awaken.state]||"";
      aw=`<b>${esc(a.name||"覚醒")}</b>：${state}<br>条件（${a.conditionMode==="ALL"?"すべて":"いずれか"}）：${esc((a.conditions||[]).map(c=>c.label).join(" ／ "))}<br>代償：${esc((a.cost&&a.cost.label)||"なし")}`;
    }
    const chips=f.effects.map(e=>`<span class="chip ${effTone(e)}"><span class="ci">${effIcon(e)}</span>${esc(e.name)}（${e.duration>=BALANCE.permanentDuration?"永続":"残"+e.duration}）</span>`).join("");
    this.openSheet(f.name+" の状況",
      `<div class="meta" style="display:flex;gap:5px;flex-wrap:wrap">${st}<span class="mchip">SP ${f.sp}/${BALANCE.sp.max}</span></div>
       <div class="awk-note" style="margin-top:12px">${aw}</div>
       ${chips?`<div class="chips" style="margin-top:12px">${chips}</div>`:`<p class="note" style="margin-top:12px">かかっている効果はありません。</p>`}`);
  },
  logTap(){ if(!this.fastForward()) this.openLog(); },
  openLog(){
    const html=`<div class="logfull">`+this.engine.log.map(e=>`<div class="le ${e.kind}">${esc(e.text)}</div>`).join("")+`</div>`;
    this.openSheet("戦闘ログ",html);
    const box=$("#sheet-body").querySelector(".logfull");
    box.scrollTop=box.scrollHeight;
  },
  strip(entries){
    const box=$("#logstrip");
    const last=entries.slice(-2);
    box.innerHTML=last.map((e,i)=>`<div class="ll ${e.kind}${i===0&&last.length>1?" old":""}">${esc(e.text)}</div>`).join("");
  },

  choose(side,action){
    this.li++;
    if(this.mode==="online"){
      const t=this.engine.turn;
      this.sentActions=this.sentActions||{};
      this.sentActions[t]=action;
      Object.keys(this.sentActions).forEach(k=>{ if(+k<t-4) delete this.sentActions[k]; });
      Net.send({t:"act",turn:t,action});
      this.startResend();
    }
    this.submitSide(side,action,true);
  },
  submitSide(side,action,fromLocal){
    if(this.acted[side]||!this.engine||this.engine.over) return;
    this.engine.submit(side,action);
    this.acted[side]=true;
    if(this.acted[0]&&this.acted[1]){ this.stopResend(); this.resolve(); return; }
    if(fromLocal) this.nextLocal();
    else if(this.li>=this.localSides.length) this.waitRemote();
  },

  /* ---------- 解決 ---------- */
  resolve(){
    $("#veil").classList.remove("on");
    this.closeSheet();
    $("#phase-label").textContent="行動処理中 — タップで送る";
    $("#cmd-area").innerHTML=`<div class="waiting"><span class="dots"></span></div>`;
    const entries=this.engine.resolveTurn();
    this.playing=true; this.skip=false;
    const k=this.SPEEDS[this.speed].k;
    let i=0, shown=[];
    const step=()=>{
      if(i>=entries.length){
        this.playing=false;
        this.prevSnap=this.engine.snapshot();
        this.renderFighters();
        if(this.engine.over) this.finish();
        else { $("#phase-label").textContent=""; this.beginInput(); }
        return;
      }
      const e=entries[i++];
      shown.push(e); this.strip(shown);
      [0,1].forEach(side=>{
        const before=this.prevSnap[side].hp, after=e.snap[side].hp;
        if(before!==after) this.popNumber(side===this.mySide?0:1,after-before,e.kind==="crit");
      });
      this.prevSnap=e.snap;
      this.renderFighters(e.snap,e.turn);
      if(e.kind==="action"||e.kind==="awaken") this.actAnim(e.actor);
      let wait=430;
      if(e.kind==="turn"){ if(!this.skip) this.banner(e.text); wait=640; }
      if(e.kind==="miss"||e.kind==="sys"||e.kind==="status") wait=320;
      const isAwk=(e.kind==="awaken"&&e.text.indexOf("AWAKENING")>=0);
      if(isAwk){ if(!this.skip) this.awakenFlash(e.text); wait=2050; }
      if(this.skip) wait=isAwk?120:16;          // タップ後は一気に流す
      else wait=Math.max(16,Math.round(wait*(isAwk?Math.max(k,0.45):k)));
      setTimeout(step,wait);
    };
    step();
  },
  /* 再生中に画面を触ったら残りを一気に流す */
  fastForward(){
    if(!this.playing) return false;
    this.skip=true;
    $("#awk").classList.remove("on");
    $("#shockwave").classList.remove("on");
    return true;
  },
  banner(text){
    const a=$("#arena");
    const b=document.createElement("div");
    b.className="banner"; b.innerHTML=`<span>${esc(text)}</span>`;
    a.appendChild(b);
    setTimeout(()=>b.remove(),1000);
  },
  awakenFlash(text){
    const sw=$("#shockwave");
    sw.classList.remove("on"); void sw.offsetWidth; sw.classList.add("on");
    setTimeout(()=>sw.classList.remove("on"),500);
    const o=$("#awk");
    $("#awk-who").textContent=text.replace("【AWAKENING】","");
    o.classList.remove("on"); void o.offsetWidth; o.classList.add("on");
    setTimeout(()=>o.classList.remove("on"),2000);
  },
  finish(){
    const win=this.engine.winner, loser=this.engine.foe(win.side);
    const el=$("#result-win");
    if(this.mode==="local"){ el.className="rw win"; el.textContent="決着"; }
    else if(win.side===this.mySide){ el.className="rw win"; el.textContent="WIN"; }
    else { el.className="rw lose"; el.textContent="LOSE"; }
    $("#result-av").innerHTML=this.avatar(win,"84","awake");
    $("#result-name").textContent=win.name+" の勝利";
    $("#result-sub").textContent=`${this.engine.turn}ターンで決着。${loser.name}は戦闘不能。`;
    const rb=$("#btn-rematch");
    rb.disabled=false; rb.textContent="もう一度たたかう";
    this.show("result");
  },
  rematch(){
    if(this.mode==="online"){
      if(!Net.connected()){ this.onNetClose(); return; }
      if(Net.role==="host"){
        const seed=Math.floor(Math.random()*4294967296);
        Net.send({t:"rematch",seed});
        this.beginOnlineBattle(this.bundles,seed);
      }else{
        Net.send({t:"rematch-req"});
        $("#btn-rematch").disabled=true;
        $("#btn-rematch").textContent="相手の準備を待っています…";
      }
    }else this.startBattle(this.chars[0],this.chars[1],null,null);
  },
});

/* ===== 14-cropper.js ===== */
/* =========================================================================
   09a. Cropper — 立ち絵の切り抜き。指でずらして拡大率を決める。
   ========================================================================= */
const Cropper = {
  V:280, img:null, scale:1, zoom:1, tx:0, ty:0, done:null, drag:null,

  open(dataUrl, onDone){
    this.done=onDone;
    const el=$("#crop-img");
    el.onload=()=>{ this.zoom=1; this.fit(); $("#cropper").classList.add("on"); };
    el.onerror=()=>{ this.close(); alert("画像を読み込めませんでした。"); };
    el.src=dataUrl;
  },
  close(){ $("#cropper").classList.remove("on"); this.done=null; },
  base(){
    const el=$("#crop-img");
    const w=el.naturalWidth||1, h=el.naturalHeight||1;
    return this.V/Math.min(w,h);
  },
  fit(){
    const el=$("#crop-img");
    const s=this.base()*this.zoom;
    const w=(el.naturalWidth||1)*s, h=(el.naturalHeight||1)*s;
    // はみ出しすぎないよう位置を制限する
    this.tx=Math.min(0,Math.max(this.V-w,this.tx||(this.V-w)/2));
    this.ty=Math.min(0,Math.max(this.V-h,this.ty||(this.V-h)/2));
    this.scale=s;
    el.style.width=w+"px"; el.style.height=h+"px";
    el.style.left=this.tx+"px"; el.style.top=this.ty+"px";
  },
  move(dx,dy){ this.tx+=dx; this.ty+=dy; this.fit(); },
  setZoom(z){
    const el=$("#crop-img");
    const cx=(this.V/2-this.tx)/this.scale, cy=(this.V/2-this.ty)/this.scale;
    this.zoom=z;
    const s=this.base()*this.zoom;
    this.tx=this.V/2-cx*s; this.ty=this.V/2-cy*s;
    this.scale=s; this.fit();
  },
  confirm(){
    const el=$("#crop-img"), S=256;
    try{
      const cv=document.createElement("canvas");
      cv.width=S; cv.height=S;
      const ctx=cv.getContext("2d");
      const sx=-this.tx/this.scale, sy=-this.ty/this.scale, sw=this.V/this.scale;
      ctx.drawImage(el,sx,sy,sw,sw,0,0,S,S);
      const url=cv.toDataURL("image/jpeg",0.85);
      const cb=this.done; this.close();
      if(cb) cb(url);
    }catch(e){ this.close(); alert("画像を変換できませんでした。"); }
  },
  bind(){
    const box=$("#crop-box");
    const start=(x,y)=>{ this.drag={x,y}; };
    const move=(x,y)=>{
      if(!this.drag) return;
      this.move(x-this.drag.x,y-this.drag.y);
      this.drag={x,y};
    };
    const end=()=>{ this.drag=null; };
    box.addEventListener("mousedown",e=>{ e.preventDefault(); start(e.clientX,e.clientY); });
    window.addEventListener("mousemove",e=>move(e.clientX,e.clientY));
    window.addEventListener("mouseup",end);
    box.addEventListener("touchstart",e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
    box.addEventListener("touchmove",e=>{ const t=e.touches[0]; e.preventDefault(); move(t.clientX,t.clientY); },{passive:false});
    box.addEventListener("touchend",end);
    $("#crop-zoom").oninput=e=>this.setZoom(Number(e.target.value)/100);
    $("#crop-ok").onclick=()=>this.confirm();
    $("#crop-cancel").onclick=()=>this.close();
  }
};

  pointsOf(stats){
    const B=BALANCE.build;
    return Math.round(stats.hp/B.hpPerPoint + stats.atk + stats.def + stats.spd);
  },
  awakenPoints(form){ return Math.round((form.atk||0)+(form.def||0)+(form.spd||0)); },

  readFile(file, onDone, onError, maxMB){
    if(!file){ onError&&onError("ファイルが選ばれていません。"); return; }
    if(maxMB&&file.size>maxMB*1024*1024){ onError&&onError(`ファイルが大きすぎます（${maxMB}MBまで）。`); return; }
    const r=new FileReader();
    r.onerror=()=>onError&&onError("ファイルを読み込めませんでした。");
    r.onload=()=>onDone(r.result);
    r.readAsDataURL(file);
  },

  blankChar(){

          <select id="e-condskill">${Object.values(SKILLS).filter(s=>s.id!=="basic_attack").map(s=>
            `<option value="${s.id}" ${a.conditions[0].skillId===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>
      </div>
      <div class="h-rule">覚醒後のステータス</div>
      <div id="e-ameter"></div>
      <div class="grid4" style="margin-top:10px">
        ${["atk","def","spd"].map(k=>`<div class="fld"><label>${k.toUpperCase()}</label>
          <input type="number" class="pt" id="e-a${k}" value="${a.form.stats[k]!=null?a.form.stats[k]:d.stats[k]}"></div>`).join("")}
        <div class="fld"><label>持続T</label><input type="number" id="e-adur" value="${a.duration}"></div>
      </div>
      <div class="grid2">

        <div class="fld" style="justify-content:flex-end">
          <label class="pickrow"><input type="checkbox" id="e-aonce" ${a.oneTime?"checked":""}><span class="pn">戦闘中1回だけ</span></label></div>
      </div>
      <div class="h-rule">覚醒形態の技</div>

      <div class="rowbtns" style="margin-top:6px">
        <button class="btn btn-gold" id="e-save">保存する</button>

      </div>`;

    $$("#edit-body .pt").forEach(el=>el.oninput=()=>this.updateMeters());
    this.updateMeters();
    $("#e-save").onclick=()=>this.saveCharacter();
    $("#e-cancel").onclick=()=>UI.show("roster");
    $("#e-file").onchange=ev=>{
      const f=ev.target.files&&ev.target.files[0];
      this.stashForm();
      this.readFile(f,url=>{
        this.lastPhoto=url;
        Cropper.open(url,cropped=>{ this.draft.portraitImage=cropped; this.renderCharacter(); });
      },msg=>{ $("#e-file-err").textContent=msg; },8);
    };
    const ed=$("#e-file-edit");
    if(ed) ed.onclick=()=>{ this.stashForm();
      Cropper.open(this.lastPhoto||this.draft.portraitImage,c=>{ this.draft.portraitImage=c; this.renderCharacter(); }); };
    const clr=$("#e-file-clear");
    if(clr) clr.onclick=()=>{ this.stashForm(); this.draft.portraitImage=null; this.renderCharacter(); };
    $("#e-bgm").onchange=e=>{ this.draft.bgm=e.target.value; };
    $("#e-bgm-test").onclick=()=>Music.preview($("#e-bgm").value);
    $("#e-audio").onchange=ev=>{
      const f=ev.target.files&&ev.target.files[0];
      this.stashForm();
      this.readFile(f,url=>{ this.draft.bgmAudio=url; this.draft.bgmAudioName=f.name; this.renderCharacter(); },
        msg=>{ $("#e-file-err").textContent=msg; },3);
    };
    const ac=$("#e-audio-clear");
    if(ac) ac.onclick=()=>{ this.stashForm(); this.draft.bgmAudio=null; this.draft.bgmAudioName=null; this.renderCharacter(); };
  },
  meterHtml(used,budget,label){
    const pct=Math.min(100,used/budget*100);
    const over=used>budget;
    return `<div class="meter${over?" over":""}">
      <div class="mrow"><span>${label}</span><span><b>${used}</b> / ${budget}${over?"（超過）":""}</span></div>
      <div class="mtrack"><div class="mfill" style="width:${pct}%"></div></div></div>`;
  },
  updateMeters(){
    const B=BALANCE.build, n=id=>Number($("#"+id).value)||0;
    const st={hp:n("e-hp"),atk:n("e-atk"),def:n("e-def"),spd:n("e-spd")};
    $("#e-meter").innerHTML=this.meterHtml(this.pointsOf(st),B.budget,"使用ポイント");
    const baseSum=st.atk+st.def+st.spd;
    const aSum=n("e-aatk")+n("e-adef")+n("e-aspd");
    $("#e-ameter").innerHTML=this.meterHtml(aSum,baseSum+B.awakenBonus,"覚醒後のATK+DEF+SPD");
  },
  /* 画面を組み直す前に、入力途中の内容を下書きへ退避する */
  stashForm(){
    const d=this.draft; if(!$("#e-name")) return;
    const v=id=>$("#"+id)?$("#"+id).value.trim():"", n=id=>$("#"+id)?Number($("#"+id).value):0;
    d.name=v("e-name"); d.portrait=v("e-portrait")||d.portrait; d.description=v("e-desc");
    ["hp","atk","def","spd"].forEach(k=>{ if(n("e-"+k)>0) d.stats[k]=n("e-"+k); });
    if($("#e-bgm")) d.bgm=$("#e-bgm").value;
    d.skills=$$('#edit-body input[data-group="normal"]:checked').map(x=>x.value);
    const picked=$$('#edit-body input[data-group="awake"]:checked').map(x=>x.value);
    if(picked.length) d.awakening.form.skills=picked;
    if($("#e-awkname")) d.awakening.name=v("e-awkname");
    ["atk","def","spd"].forEach(k=>{ if(n("e-a"+k)>0) d.awakening.form.stats[k]=n("e-a"+k); });
  },
  saveCharacter(){
    const v=id=>$("#"+id).value.trim(), n=id=>Number($("#"+id).value);
    const picked=g=>$$(`#edit-body input[data-group="${g}"]:checked`).map(x=>x.value);
    const B=BALANCE.build, err=[];
    if(!v("e-name")) err.push("名前を入力してください。");
    const st={hp:n("e-hp"),atk:n("e-atk"),def:n("e-def"),spd:n("e-spd")};
    if(st.hp<B.minHp) err.push(`HPは${B.minHp}以上にしてください。`);
    ["atk","def","spd"].forEach(k=>{ if(st[k]<B.minStat) err.push(`${k.toUpperCase()}は${B.minStat}以上にしてください。`); });
    const used=this.pointsOf(st);
    if(used>B.budget) err.push(`ポイントが${used-B.budget}超過しています。`);
    const aSum=n("e-aatk")+n("e-adef")+n("e-aspd"), cap=st.atk+st.def+st.spd+B.awakenBonus;
    if($("#e-awk").checked&&aSum>cap) err.push(`覚醒後の合計が${aSum-cap}超過しています。`);
    const normal=picked("normal");
    if(!normal.length) err.push("通常形態の技を1つ以上選んでください。");
    if(err.length){ $("#edit-err").textContent=err.join(" "); return; }

    const d=this.draft;
    d.name=v("e-name"); d.portrait=v("e-portrait")||"◆"; d.description=v("e-desc");
    d.bgm=$("#e-bgm").value;
    d.stats=st; d.skills=normal; d.custom=true;
    const a=d.awakening;
    a.enabled=$("#e-awk").checked;
    a.name=v("e-awkname")||"覚醒形態";
    const ct=$("#e-cond").value, cv=n("e-condval");
    const labels={HP_BELOW:`HPが${Math.round(cv*100)}%以下になる`,DAMAGE_TAKEN:`累計${cv}ダメージを受ける`,
      SKILL_USED:`「${SKILLS[$("#e-condskill").value].name}」を${cv}回使う`,TURN_REACHED:`${cv}ターン経過する`};
    a.conditions=[{type:ct,value:cv,skillId:$("#e-condskill").value,label:labels[ct]}];
    a.conditionMode="ANY";
    a.form.stats={atk:n("e-aatk"),def:n("e-adef"),spd:n("e-aspd")};
    a.form.skills=picked("awake").length?picked("awake"):normal;
    a.duration=n("e-adur");
    a.oneTime=$("#e-aonce").checked;
    const hpc=n("e-acost");
    const pc=(a.cost||{}).hpPercentPerTurn;
    a.cost={hpPerTurn:hpc,
      label:`${a.duration}ターン持続${pc?`／毎ターン最大HPの${pc.minPercent}〜${pc.maxPercent}%`:(hpc?`／毎ターンHP-${hpc}`:"")}${a.oneTime?"／戦闘中1回だけ":""}`};
    if(pc) a.cost.hpPercentPerTurn=pc;

    const id=this.editingId||("c_"+Date.now().toString(36));
    d.id=id; CHARACTERS[id]=d; Store.save();
    UI.renderRoster(); UI.show("roster");
  },

  /* ---------- 技エディタ ---------- */
  openSkill(){
    this.effects=[];
    $("#skill-body").innerHTML=`
      <div class="fld"><label>技名</label><input type="text" id="k-name" placeholder="例：雷撃"></div>
      <div class="fld"><label>説明</label><input type="text" id="k-desc" placeholder="戦闘中に表示される一文"></div>
      <div class="grid2">
        <div class="fld"><label>タイプ</label><select id="k-type">
          <option value="ATTACK">攻撃</option><option value="SPECIAL">特殊</option>
          <option value="DEFENSE">防御</option><option value="SUPPORT">補助</option></select></div>
        <div class="fld"><label>ダメージ計算</label><select id="k-formula">
          <option value="standard">通常（ATK＋威力－DEF）</option>
          <option value="ignoreDef">防御無視</option>
          <option value="fixed">固定ダメージ</option>
          <option value="maxHpRatio">最大HP割合（威力＝%）</option>
          <option value="currentHpRatio">現在HP割合（威力＝%）</option>
          <option value="spdBased">SPD依存</option></select></div>
      </div>
      <div class="grid4">
        <div class="fld"><label>威力</label><input type="number" id="k-power" value="40"></div>
        <div class="fld"><label>命中</label><input type="number" id="k-acc" value="95"></div>
        <div class="fld"><label>SP</label><input type="number" id="k-cost" value="1"></div>
        <div class="fld"><label>優先度</label><input type="number" id="k-prio" value="0"></div>
      </div>
      <div class="h-rule">SPの注ぎ込み</div>
      <p class="note">最大SPを基本SPより大きくすると、使うたびに「いくら注ぎ込むか」を選べる技になります。</p>
      <div class="grid3" style="margin-top:8px">
        <div class="fld"><label>最大SP</label><input type="number" id="k-costmax" value="0" placeholder="0=固定"></div>
        <div class="fld"><label>SP1ごとの威力</label><input type="number" id="k-perpow" value="0"></div>
        <div class="fld"><label>SP1ごとの持続T</label><input type="number" id="k-perdur" value="0"></div>
      </div>
      <div class="grid4" style="margin-top:8px">
        <div class="fld"><label>攻撃回数</label><input type="number" id="k-hits" value="1"></div>
        <div class="fld"><label>ばらつき%</label><input type="number" id="k-vary" value="0"></div>
        <div class="fld"><label>回復%</label><input type="number" id="k-heal" value="0"></div>
        <div class="fld"><label>吸収%</label><input type="number" id="k-drain" value="0"></div>
      </div>
      <div class="grid2" style="margin-top:8px">
        <div class="fld"><label>使用回数（0=無制限）</label><input type="number" id="k-uses" value="0"></div>
        <div class="fld" style="gap:8px;justify-content:flex-end">
          <label class="pickrow"><input type="checkbox" id="k-gb"><span class="pn">防御貫通</span></label></div>
      </div>
      <div class="grid2">
        <label class="pickrow"><input type="checkbox" id="k-bp"><span class="pn">バフ貫通</span></label>
        <label class="pickrow"><input type="checkbox" id="k-cleanse"><span class="pn">自分の効果を全解除</span></label>
      </div>
      <div class="h-rule">状態異常・効果</div>
      <p class="note">好きなだけ組み合わせられます。成功率を100%未満にすると運要素のある技になります。</p>
      <div class="stack" id="k-efflist"></div>
      <button class="btn btn-line" id="k-addeff"><span class="ic">✚</span>効果を追加</button>
      <div id="skill-err" class="err"></div>
      <div class="rowbtns" style="margin-top:6px">
        <button class="btn btn-gold" id="k-save">技を保存する</button>
        <button class="btn btn-line" id="k-cancel">やめる</button>
      </div>`;
    $("#k-addeff").onclick=()=>{ this.effects.push(this.newEffect("poison")); this.renderEffects(); };
    $("#k-save").onclick=()=>this.saveSkill();
    $("#k-cancel").onclick=()=>UI.show("roster");
    this.renderEffects();
    UI.show("skill");
  },
  newEffect(key){
    const st=STATUS[key];
    return {key, target:(st.tone==="good"?"self":"enemy"),
      chance:st.chance!=null?Math.round(st.chance*100):100, duration:null, amount:null};
  },
  amountField(st){
    if(st.kind==="STAT") return {label:"倍率",step:"0.05",def:st.mult};
    if(st.percent!=null) return {label:"最大HP%",step:"1",def:st.percent};
    if(st.kind==="COUNTER") return {label:"返す割合",step:"0.1",def:st.ratio};
    if(st.value!=null) return {label:"数値",step:"1",def:st.value};
    return null;
  },
  renderEffects(){
    const box=$("#k-efflist");
    if(!this.effects.length){ box.innerHTML=`<p class="note">まだ効果はありません。</p>`; return; }
    box.innerHTML=this.effects.map((ef,i)=>{
      const st=STATUS[ef.key];
      const amt=this.amountField(st);
      const instant=INSTANT_KINDS.indexOf(st.kind)>=0;
      const dur=ef.duration!=null?ef.duration:(st.duration||1);
      return `<div class="effrow">
        <div class="eh"><span>${st.icon} ${esc(st.name)}</span>
          <button class="btn btn-ghost" data-del="${i}" style="width:auto;padding:2px 8px;font-size:12px">削除</button></div>
        <div class="ed">${esc(statusNote(st))}</div>
        <div class="grid2" style="margin-top:9px">
          <div class="fld"><label>種類</label><select data-k="key" data-i="${i}">
            ${Object.keys(STATUS).map(k=>`<option value="${k}" ${ef.key===k?"selected":""}>${STATUS[k].icon} ${STATUS[k].name}</option>`).join("")}
          </select></div>
          <div class="fld"><label>対象</label><select data-k="target" data-i="${i}">
            <option value="enemy" ${ef.target==="enemy"?"selected":""}>相手</option>
            <option value="self" ${ef.target==="self"?"selected":""}>自分</option></select></div>
        </div>
        <div class="grid3" style="margin-top:8px">
          <div class="fld"><label>成功率%</label><input type="number" data-k="chance" data-i="${i}" value="${ef.chance}"></div>
          ${instant?`<div class="fld"><label>持続T</label><input type="number" value="0" disabled></div>`
            :`<div class="fld"><label>持続T</label><input type="number" data-k="duration" data-i="${i}" value="${dur}"></div>`}
          ${amt?`<div class="fld"><label>${amt.label}</label>
            <input type="number" step="${amt.step}" data-k="amount" data-i="${i}" value="${ef.amount!=null?ef.amount:amt.def}"></div>`:`<div></div>`}
        </div></div>`;
    }).join("");
    box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      this.effects.splice(+b.dataset.del,1); this.renderEffects();
    });
    box.querySelectorAll("[data-k]").forEach(el=>{
      el.onchange=()=>{
        const i=+el.dataset.i, k=el.dataset.k;
        if(k==="key") this.effects[i]=this.newEffect(el.value);
        else if(k==="target") this.effects[i].target=el.value;
        else this.effects[i][k]=Number(el.value);
        this.renderEffects();
      };
    });
  },
  buildEffects(){
    return this.effects.map(ef=>{
      const st=STATUS[ef.key];
      const instant=INSTANT_KINDS.indexOf(st.kind)>=0;
      const e={target:ef.target,kind:st.kind,name:st.name,icon:st.icon,tone:st.tone,
        duration:instant?0:(ef.duration!=null?ef.duration:(st.duration||1))};
      if(st.stat) e.stat=st.stat;
      const amt=ef.amount;
      if(st.kind==="STAT") e.mult=amt!=null?amt:st.mult;
      else if(st.percent!=null) e.percent=amt!=null?amt:st.percent;
      else if(st.kind==="COUNTER") e.ratio=amt!=null?amt:st.ratio;
      else if(st.value!=null) e.value=amt!=null?amt:st.value;
      if(ef.chance<100) e.chance=Math.max(0,Math.min(1,ef.chance/100));
      return e;
    });
  },
  saveSkill(){
    const v=id=>$("#"+id).value.trim(), n=id=>Number($("#"+id).value);
    if(!v("k-name")){ $("#skill-err").textContent="技名を入力してください。"; return; }
    const cost=n("k-cost"), cmax=n("k-costmax");
    if(cmax&&cmax<cost){ $("#skill-err").textContent="最大SPは基本SP以上にしてください。"; return; }
    const id="s_"+Date.now().toString(36);
    const s={id,name:v("k-name"),description:v("k-desc"),type:$("#k-type").value,
      power:n("k-power"),accuracy:n("k-acc"),cost,priority:n("k-prio"),
      hits:Math.max(1,n("k-hits")),formula:$("#k-formula").value,
      guardBreak:$("#k-gb").checked,buffPierce:$("#k-bp").checked,cleanse:$("#k-cleanse").checked,
      effects:this.buildEffects(),custom:true};
    if(cmax>cost){ s.costMax=cmax; s.powerPerSp=n("k-perpow"); s.durationPerSp=n("k-perdur"); }
    if(n("k-vary")>0) s.varyPercent=Math.min(60,n("k-vary"));
    if(n("k-heal")>0) s.healPercent=n("k-heal");
    if(n("k-drain")>0) s.drain=n("k-drain")/100;
    if(n("k-uses")>0) s.uses=n("k-uses");
    SKILLS[id]=s; Store.save();
    UI.show("roster");
  }
};

const HOWTO = `
<p>キャラクターを選んで1対1で戦うコマンドバトルです。ローカル対戦・AI対戦・オンライン対戦の3つがあります。</p>
<div class="h-rule">1ターンの流れ</div>

<b>状況</b>：能力値・効果・覚醒条件の確認。ターンは消費しません。<br>

<div class="h-rule">状態異常</div>
<p class="note">${Object.values(STATUS).map(s=>s.icon+" "+s.name).join("　")}</p>

<div class="h-rule">演出の速さ</div>

<p class="note">二人が同じあいことばを入れて「つながる」を押すだけです。役割を選ぶ必要はなく、先に押した方が自動的に待ち受けになります。</p>
<p class="note">やり取りするのは選んだコマンドだけで、計算は両方の端末で行われます。相手の自作キャラは技の内容ごと接続時に受け取るので、事前の共有は要りません（受け取った技はその対戦のあいだだけ使われ、あなたの技一覧は変わりません）。</p>
<p class="note">携帯回線など直接つながりにくい回線では中継サーバーを経由します。うまくいかないときは、二人ともWi-Fiに切り替えるか、あいことばを変えてやり直してみてください。お互いのアプリ（このファイル）の版が違うと接続できません。</p>`;

function boot(){
  Store.load();
  Store.loadPrefs();
  UI.applyPrefs();
  $("#howto-body").innerHTML=HOWTO;
  $$("[data-go]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.go;
    if(t==="roster") UI.renderRoster();
    if(t==="title") Net.close();
    UI.show(t);
  });
  $$("[data-mode]").forEach(b=>b.onclick=()=>UI.openMode(b.dataset.mode));
  $("#slot0").onclick=()=>{ UI.slotFocus=0; UI.renderSelect(); };
  $("#slot1").onclick=()=>{ UI.slotFocus=1; UI.renderSelect(); };
  $("#btn-start").onclick=()=>UI.startLocalOrAi();
  $("#btn-connect").onclick=()=>UI.connect();
  $("#btn-cancel-net").onclick=()=>UI.cancelNet();
  $("#online-back").onclick=()=>{ Net.close(); UI.show("title"); };
  $("#btn-rematch").onclick=()=>UI.rematch();
  $("#btn-reselect").onclick=()=>{
    if(UI.mode==="online"){ Net.close(); UI.openOnline(); }
    else UI.openMode(UI.mode);
  };
  $("#btn-reviewlog").onclick=()=>UI.openLog();
  $("#logstrip").onclick=()=>UI.logTap();
  $("#arena").onclick=()=>UI.fastForward();
  $("#btn-speed").onclick=()=>UI.cycleSpeed();
  $("#sheet-close").onclick=()=>UI.closeSheet();
  $("#btn-mute").onclick=()=>UI.toggleMute();
  Cropper.bind();
  ["pointerdown","touchend","keydown"].forEach(ev=>
    document.addEventListener(ev,()=>UI.nudgeMusic(),{passive:true}));
  $("#scrim").onclick=()=>UI.closeSheet();
  $("#btn-new-char").onclick=()=>Editor.openCharacter(null,null);
  $("#btn-new-skill").onclick=()=>Editor.openSkill();
  const msg=(text,cls)=>{ $("#io-msg").innerHTML=`<div class="status ${cls||""}">${text}</div>`; };
  $("#btn-save-file").onclick=()=>{
    const d=Store.exportData();
    const n=Object.keys(d.characters).length, k=Object.keys(d.skills).length;
    if(!n&&!k){ msg("保存するデータがまだありません。まずキャラクターか技を作ってください。","bad"); return; }
    try{
      Store.download();
      msg(`キャラクター${n}体・技${k}個をファイルに保存しました。`,"ok");
    }catch(e){ msg("保存できませんでした。ブラウザの設定をご確認ください。","bad"); }
  };
  $("#data-file").onchange=ev=>{
    const f=ev.target.files&&ev.target.files[0];
    ev.target.value="";
    if(!f) return;
    const r=new FileReader();
    r.onerror=()=>msg("ファイルを読み込めませんでした。","bad");
    r.onload=()=>{
      try{
        const res=Store.importData(JSON.parse(r.result));
        UI.renderRoster();
        msg(`キャラクター${res.characters}体・技${res.skills}個を読み込みました。`,"ok");
      }catch(e){ msg("このファイルは読み込めませんでした。書き出したJSONファイルを選んでください。","bad"); }
    };
    r.readAsText(f);
  };
  $("#btn-text-io").onclick=()=>{
    $("#io-area").innerHTML=`<div class="h-rule">文字でやりとり</div>
      <p class="note">上の欄をコピーすれば手で渡せます。下の欄に貼り付けて読み込むこともできます。</p>
      <textarea id="io-out" readonly>${esc(Store.exportAll())}</textarea>
      <div style="height:10px"></div>
      <textarea id="io-in" placeholder="ここに貼り付け"></textarea>
      <div style="height:8px"></div><button class="btn btn-line" id="io-run">貼り付けた内容を読み込む</button>
      <div id="io-err" class="err"></div>`;
    $("#io-run").onclick=()=>{
      try{
        const res=Store.importData(JSON.parse($("#io-in").value));
        UI.renderRoster();
        $("#io-err").innerHTML=`<span style="color:#9DF0E4">キャラクター${res.characters}体・技${res.skills}個を読み込みました。</span>`;
      }catch(e){ $("#io-err").textContent="読み込めませんでした。全文が貼れているか確認してください。"; }
    };
  };
  document.addEventListener("keydown",ev=>{
    if(ev.key==="Escape"){ UI.closeSheet(); return; }
    if(!$("#s-battle").classList.contains("on")||UI.playing) return;
    const btns=$$("#cmd-area [data-cmd], #sheet-body .skl");
    const i=parseInt(ev.key,10)-1;
    if(i>=0&&i<btns.length&&!btns[i].disabled) btns[i].click();
  });
}
document.addEventListener("DOMContentLoaded",boot);
</script>
</body>
</html>
