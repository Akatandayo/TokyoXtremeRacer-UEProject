<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0B18">
<title>覚醒 — TRPGキャラクター コマンドバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 10-core.css ===== */
:root{
  --ink:#0E0B18; --panel:rgba(38,30,62,.72); --panel2:rgba(28,22,48,.86);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ivory:#F2EDE4; --dim:#A99DBE;
  --me:#4FD6C8; --foe:#F2566A; --gold:#F0C550; --violet:#9B7BE8; --jade:#4FD6C8;
  --r:18px;
  --sans:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#0E0B18;color:var(--ivory);font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(90% 60% at 20% 0%,#38246B 0%,rgba(14,11,24,0) 55%),
  radial-gradient(80% 60% at 90% 15%,#1F4E63 0%,rgba(14,11,24,0) 50%),
  radial-gradient(90% 70% at 50% 100%,#3A1C42 0%,rgba(14,11,24,0) 60%),#0E0B18}
#bg::after{content:"";position:absolute;width:70vmax;height:70vmax;left:10%;top:8%;
  background:radial-gradient(closest-side,rgba(155,123,232,.20),transparent 70%);
  filter:blur(30px);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-8%,-4%,0) scale(1)}to{transform:translate3d(12%,10%,0) scale(1.18)}}
.app{max-width:480px;margin:0 auto;padding:14px 14px calc(22px + var(--safe-b));min-height:100%}
.screen{display:none}
.screen.on{display:block;animation:screenIn .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{position:relative;display:block;width:100%;border-radius:var(--r);padding:15px 18px;text-align:center;
  font-weight:700;letter-spacing:.06em;color:#F2EDE4;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.03)),var(--panel2);
  border:1px solid var(--line2);box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .09s,filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn-gold{color:#2A1C00;border-color:rgba(255,235,170,.55);
  background:linear-gradient(180deg,#FFE08A,#E2A92C 60%,#C98A18);
  box-shadow:0 8px 22px rgba(224,169,44,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-line{background:rgba(255,255,255,.04);border:1px solid var(--line2);box-shadow:none;font-weight:500}
.btn-ghost{background:none;border:none;box-shadow:none;color:var(--dim);font-weight:500;padding:10px}
.btn-ghost:hover{color:var(--ivory)}
.btn .ic{font-size:19px;margin-right:9px;vertical-align:-2px}
.btn-sub{display:block;font-size:11.5px;font-weight:400;color:rgba(255,255,255,.55);letter-spacing:0;margin-top:2px}
.btn-gold .btn-sub{color:rgba(50,32,0,.62)}
.h-rule{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11px;letter-spacing:.2em;margin:22px 0 10px}
.h-rule::after{content:"";flex:1;height:1px;background:var(--line)}
.note{color:var(--dim);font-size:12.5px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px}
.topbar .tt{font-family:var(--serif);font-size:20px;letter-spacing:.06em}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stack{display:flex;flex-direction:column;gap:9px}
.rowbtns{display:flex;gap:9px}.rowbtns .btn{flex:1}

.hero{position:relative;text-align:center;padding:11vh 0 0}
.hero .ring{position:absolute;left:50%;top:calc(11vh + 52px);width:250px;height:250px;margin:-125px 0 0 -125px;
  border-radius:50%;border:1px solid rgba(240,197,80,.25);
  box-shadow:0 0 70px rgba(240,197,80,.16),inset 0 0 60px rgba(240,197,80,.08);
  animation:ringIn 1.5s cubic-bezier(.2,.8,.2,1) both}
.hero .ring::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(240,197,80,.12)}
@keyframes ringIn{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
.logo{position:relative;font-family:var(--serif);font-weight:800;font-size:clamp(62px,22vw,108px);line-height:1;
  letter-spacing:.16em;margin:0;background:linear-gradient(170deg,#FFF3CE 6%,var(--gold) 45%,#8A5F0C 98%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(240,197,80,.35));animation:logoIn 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes logoIn{from{opacity:0;letter-spacing:.55em;filter:blur(12px)}to{opacity:1;letter-spacing:.16em;filter:blur(0)}}
.logo-sub{position:relative;color:rgba(240,197,80,.75);letter-spacing:.32em;font-size:10.5px;margin-top:14px}
.title-lead{color:#CDC3DC;font-size:13.5px;max-width:23em;margin:20px auto 0;text-align:center}
.title-actions{display:flex;flex-direction:column;gap:11px;margin:30px auto 0}

.slot-tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.slot{border-radius:14px;padding:9px 12px;text-align:left;background:rgba(255,255,255,.04);
  border:1px solid var(--line);transition:.18s}
.slot.active{border-color:rgba(240,197,80,.7);background:linear-gradient(180deg,rgba(240,197,80,.16),rgba(240,197,80,.04));
  box-shadow:0 6px 18px rgba(240,197,80,.14)}
.slot .who{font-size:10.5px;color:var(--dim);letter-spacing:.16em}
.slot .pick{font-family:var(--serif);font-size:17px;margin-top:1px}
.preview{padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.preview::before{content:"";position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(155,123,232,.30),transparent);filter:blur(6px)}
.pv-head{display:flex;gap:14px;align-items:center;position:relative}
.av{position:relative;flex:0 0 auto;display:grid;place-items:center;border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.02));
  border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.av-72{width:72px;height:72px;font-size:34px}
.av-84{width:84px;height:84px;font-size:40px}
.av-64{width:64px;height:64px;font-size:30px}
.av-44{width:44px;height:44px;font-size:21px;border-radius:15px}
.av.hasimg{background:#0B0813;overflow:hidden}
.avimg{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.upload{display:flex;gap:12px;align-items:center}
.upload .hint{font-size:11.5px;color:var(--dim);flex:1}
.filebtn{display:inline-block;width:auto;padding:10px 14px;font-size:13px;cursor:pointer}
.av.me{border-color:rgba(79,214,200,.5);box-shadow:0 8px 24px rgba(79,214,200,.22),inset 0 1px 0 rgba(255,255,255,.25)}
.av.foe{border-color:rgba(242,86,106,.5);box-shadow:0 8px 24px rgba(242,86,106,.22),inset 0 1px 0 rgba(255,255,255,.25)}
.av.awake{border-color:rgba(240,197,80,.85);animation:aura 2.2s ease-in-out infinite}
@keyframes aura{0%,100%{box-shadow:0 0 22px rgba(240,197,80,.35),inset 0 1px 0 rgba(255,255,255,.35)}
  50%{box-shadow:0 0 46px rgba(240,197,80,.75),inset 0 1px 0 rgba(255,255,255,.45)}}
.pv-name{font-family:var(--serif);font-size:22px;letter-spacing:.04em}
.pv-desc{font-size:12.5px;color:var(--dim);margin-top:2px}
.bars{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.bar{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--dim)}
.bar .bl{width:30px;letter-spacing:.1em}
.bar .bt{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .bf{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--jade));
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar .bv{width:36px;text-align:right;color:var(--ivory);font-weight:500}
.awk-note{margin-top:13px;border-radius:14px;padding:10px 12px;font-size:12px;
  background:linear-gradient(180deg,rgba(240,197,80,.14),rgba(240,197,80,.04));
  border:1px solid rgba(240,197,80,.3);color:#F5E3B0}
.awk-note b{font-family:var(--serif);letter-spacing:.06em}
.tray{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 8px}
.tray::-webkit-scrollbar{display:none}
.thumb{flex:0 0 auto;width:78px;text-align:center;padding:8px 4px;border-radius:16px;
  border:1px solid transparent;transition:.16s;display:flex;flex-direction:column;align-items:center}
.thumb.on{border-color:rgba(240,197,80,.65);background:rgba(240,197,80,.10)}
.thumb .tn{font-size:11px;margin-top:5px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:70px}
.thumb.on .tn{color:var(--ivory)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.seg button{border:1px solid var(--line);border-radius:13px;padding:11px 4px;font-size:13.5px;
  background:rgba(255,255,255,.04);font-weight:500}
.seg button.on{border-color:rgba(240,197,80,.7);color:#F5E3B0;
  background:linear-gradient(180deg,rgba(240,197,80,.2),rgba(240,197,80,.05))}
.sticky-cta{position:sticky;bottom:calc(8px + var(--safe-b));margin-top:14px;z-index:5}

/* ===== 20-battle.css ===== */
#s-battle.on{display:flex;flex-direction:column;min-height:calc(100vh - 36px);min-height:calc(100dvh - 36px)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#btn-speed,#btn-mute{cursor:pointer;white-space:nowrap}
.arena{cursor:pointer}
.pill{font-size:11px;letter-spacing:.12em;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.07);
  border:1px solid var(--line);color:#D9CFE8}
.pill.turn{font-family:var(--serif);letter-spacing:.16em;color:#F5E3B0;border-color:rgba(240,197,80,.35);
  background:rgba(240,197,80,.10)}
.arena{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  padding:14px 13px;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,rgba(242,86,106,.10),rgba(14,11,24,0) 34%,rgba(14,11,24,0) 64%,rgba(79,214,200,.10)),
             var(--panel);border:1px solid var(--line);
  box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.arena::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
.unit{display:flex;gap:12px;align-items:center;position:relative;z-index:2}
.unit.foe{flex-direction:row-reverse;text-align:right}
.unit .info{flex:1;min-width:0}
.unit .nmrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.unit.foe .nmrow{justify-content:flex-end}
.unit .nm{font-family:var(--serif);font-size:17px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .owner{font-size:10px;letter-spacing:.18em;color:var(--dim);display:block}
.badge{font-size:10px;letter-spacing:.08em;border-radius:99px;padding:2px 9px;font-weight:700;white-space:nowrap}
.b-gold{color:#2A1C00;background:linear-gradient(180deg,#FFE79E,#E5AE31);box-shadow:0 2px 10px rgba(229,174,49,.45)}
.b-jade{color:#052B28;background:linear-gradient(180deg,#8FF0E4,#3FC2B4)}
.b-pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.78;transform:scale(1.06)}}
.hpline{margin-top:7px}
.hpbar{position:relative;height:13px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.hpghost{position:absolute;inset:0 auto 0 0;height:100%;background:rgba(255,255,255,.45);border-radius:99px;
  transition:width .75s cubic-bezier(.4,0,.2,1) .3s}
.hpfill{position:absolute;inset:0 auto 0 0;height:100%;border-radius:99px;transition:width .3s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(180deg,#7BE8D8,#2FA99C);box-shadow:0 0 12px rgba(79,214,200,.5)}
.unit.foe .hpfill{background:linear-gradient(180deg,#FF8797,#D23A50);box-shadow:0 0 12px rgba(242,86,106,.45)}
.hpfill.awake{background:linear-gradient(180deg,#FFE79E,#E0A62A);box-shadow:0 0 16px rgba(240,197,80,.6)}
.hpfill.low{animation:lowPulse 1.2s ease-in-out infinite}
@keyframes lowPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.hpnum{display:flex;gap:6px;justify-content:space-between;font-size:11px;color:#C6BBD6;margin-top:3px}
.unit.foe .hpnum{flex-direction:row-reverse}
.hpnum b{color:var(--ivory);font-weight:700}
.spbar{display:flex;gap:3px;margin-top:6px}
.unit.foe .spbar{flex-direction:row-reverse}
.pip{flex:1;max-width:17px;height:5px;border-radius:99px;background:rgba(255,255,255,.12);transition:.25s}
.pip.on{background:linear-gradient(90deg,#7BE8D8,#3FC2B4);box-shadow:0 0 6px rgba(79,214,200,.6)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.unit.foe .chips{justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:2px 8px;border-radius:99px;
  background:rgba(255,255,255,.08);border:1px solid var(--line);color:#D6CCE4}
.chip .ci{font-size:11px}
.chip.good{color:#9DF0E4;border-color:rgba(79,214,200,.4);background:rgba(79,214,200,.12)}
.chip.bad{color:#FFA9B6;border-color:rgba(242,86,106,.4);background:rgba(242,86,106,.12)}
.chip.gold{color:#F8DE9E;border-color:rgba(240,197,80,.45);background:rgba(240,197,80,.14)}
.avwrap{position:relative}
.unit.act .avwrap{animation:lunge .5s cubic-bezier(.3,.9,.3,1)}
.unit.foe.act .avwrap{animation:lungeFoe .5s cubic-bezier(.3,.9,.3,1)}
@keyframes lunge{30%{transform:translateY(-16px) scale(1.07)}100%{transform:none}}
@keyframes lungeFoe{30%{transform:translateY(16px) scale(1.07)}100%{transform:none}}
.unit.hurt .avwrap{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.unit.hurt .av::after{content:"";position:absolute;inset:0;border-radius:22px;background:rgba(255,120,140,.5);
  animation:flashOut .45s ease forwards}
@keyframes flashOut{to{opacity:0}}
.float{position:absolute;left:50%;top:-8px;font-family:var(--serif);font-weight:800;font-size:30px;color:#FFB3BE;
  pointer-events:none;z-index:6;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 18px rgba(255,90,110,.75);
  animation:floatUp 1.05s cubic-bezier(.2,.8,.2,1) forwards}
.float.heal{color:#A6F5CE;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 18px rgba(80,230,160,.7)}
.float.crit{color:#FFDD8C;font-size:40px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,14px) scale(.7)}
  22%{opacity:1;transform:translate(-50%,-4px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.banner span{font-family:var(--serif);font-size:26px;letter-spacing:.36em;color:#F7EDD6;
  text-shadow:0 0 24px rgba(0,0,0,.9);animation:bannerSweep 1s ease forwards}
@keyframes bannerSweep{0%{opacity:0;transform:translateX(-26px)}28%{opacity:1;transform:none}
  68%{opacity:1}100%{opacity:0;transform:translateX(26px)}}

.logstrip{margin-top:10px;border-radius:14px;padding:9px 13px;min-height:58px;display:flex;flex-direction:column;
  justify-content:center;gap:2px;background:rgba(0,0,0,.35);border:1px solid var(--line);cursor:pointer;
  width:100%;text-align:left}
.logstrip .ll{font-size:13px;color:#D9CFE8;animation:lineIn .25s ease both}
.logstrip .ll.old{opacity:.45;font-size:12px}
@keyframes lineIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ll.dmg{color:#FFA9B6}.ll.heal{color:#A6F5CE}.ll.crit{color:#FFDD8C;font-weight:700}
.ll.awaken{color:var(--gold);font-family:var(--serif)}.ll.miss{color:var(--dim)}
.ll.status{color:#C4B0EE}.ll.sys{color:var(--dim);font-size:12px}
.ll.turn{color:#8E82A8;font-size:11px;letter-spacing:.2em}
.ll.win{color:var(--gold);font-family:var(--serif)}

.dock{margin-top:10px;display:flex;flex-direction:column;gap:9px}
.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cbtn{border-radius:var(--r);padding:14px 10px;text-align:center;font-weight:700;letter-spacing:.08em;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),var(--panel2);
  border:1px solid var(--line2);box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .09s,filter .15s}
.cbtn:hover{filter:brightness(1.15)}
.cbtn .ci{display:block;font-size:21px;margin-bottom:2px;line-height:1}
.cbtn .cl{font-size:14.5px}
.cbtn.wide{grid-column:1/-1}
.cbtn.awaken{color:#2A1C00;border-color:rgba(255,236,178,.6);position:relative;overflow:hidden;
  background:linear-gradient(180deg,#FFE79E,#E2A92C 62%,#C98A18);animation:awkBtn 1.8s ease-in-out infinite}
@keyframes awkBtn{0%,100%{box-shadow:0 8px 20px rgba(226,169,44,.35),inset 0 1px 0 rgba(255,255,255,.65)}
  50%{box-shadow:0 12px 34px rgba(255,214,110,.7),inset 0 1px 0 rgba(255,255,255,.75)}}
.cbtn.awaken::after{content:"";position:absolute;top:0;bottom:0;width:55%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));
  animation:sweep 2.2s linear infinite}
@keyframes sweep{from{left:-55%}to{left:110%}}
.waiting{border-radius:var(--r);padding:20px;text-align:center;color:var(--dim);font-size:13px;
  background:rgba(255,255,255,.04);border:1px solid var(--line)}
.dots::after{content:"…";animation:dots 1.1s steps(3) infinite}
@keyframes dots{0%{content:"."}33%{content:".."}66%{content:"…"}}

/* ===== 30-overlays.css ===== */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:84vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  background:linear-gradient(180deg,#221A3C,#150F27);border-top:1px solid var(--line2);
  border-radius:26px 26px 0 0;box-shadow:0 -14px 50px rgba(0,0,0,.6)}
.sheet.on{transform:translateY(0)}
.sheet-in{max-width:480px;margin:0 auto;width:100%;padding:8px 14px calc(16px + var(--safe-b));overflow-y:auto}
.grab{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.28);margin:6px auto 10px}
.sheet-title{font-family:var(--serif);font-size:17px;letter-spacing:.06em;margin-bottom:10px;display:flex;
  justify-content:space-between;align-items:center}
.scrim{position:fixed;inset:0;background:rgba(6,4,12,.6);z-index:55;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.skill-list{display:flex;flex-direction:column;gap:9px}
.skl{position:relative;display:block;width:100%;text-align:left;border-radius:16px;padding:12px 13px 12px 17px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.15s}
.skl:hover:not(:disabled){background:rgba(255,255,255,.09)}
.skl:disabled{opacity:.42}
.skl::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:99px;background:var(--violet)}
.skl.t-ATTACK::before{background:#F2566A}.skl.t-DEFENSE::before{background:#4FD6C8}
.skl.t-SUPPORT::before{background:var(--gold)}.skl.t-SPECIAL::before{background:var(--violet)}
.skl .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.skl .snm{font-weight:700;font-size:15px;letter-spacing:.03em}
.skl .cost{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;
  background:rgba(79,214,200,.16);color:#9DF0E4;border:1px solid rgba(79,214,200,.35);white-space:nowrap}
.skl .cost.no{background:rgba(242,86,106,.14);color:#FFA9B6;border-color:rgba(242,86,106,.35)}
.skl .sds{font-size:12px;color:var(--dim);margin-top:4px}
.skl .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.mchip{font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:#CDC2DE;
  border:1px solid var(--line)}
.mchip.hot{color:#FFC9A0;border-color:rgba(255,160,90,.35);background:rgba(255,160,90,.12)}
.logfull{max-height:62vh;overflow-y:auto;font-size:13.5px}
.le{padding:2.5px 0;color:#CBC1D9}
.le.dmg{color:#FFA9B6}.le.heal{color:#A6F5CE}.le.miss{color:var(--dim)}.le.crit{color:#FFDD8C;font-weight:700}
.le.sys{color:#9E93B1;font-size:12.5px}.le.status{color:#C4B0EE}.le.action{color:var(--ivory)}
.le.awaken{color:var(--gold);font-family:var(--serif);letter-spacing:.06em}
.le.turn{color:#7E729A;font-size:11px;letter-spacing:.2em;margin-top:8px;padding-top:6px;
  border-top:1px solid rgba(255,255,255,.08)}
.le.win{color:var(--gold);font-family:var(--serif);font-size:16px}

.veil{position:fixed;inset:0;background:rgba(10,7,18,.96);display:none;place-items:center;text-align:center;
  padding:24px;z-index:70}
.veil.on{display:grid}
.veil .vt{font-family:var(--serif);font-size:26px;letter-spacing:.14em}
.veil .vs{color:var(--dim);font-size:13px;margin:10px 0 26px}
.awk{position:fixed;inset:0;display:none;place-items:center;z-index:80;overflow:hidden;
  background:radial-gradient(60% 60% at 50% 50%,rgba(240,197,80,.26),rgba(10,7,18,.97) 74%)}
.awk.on{display:grid;animation:awkFade 2s ease forwards}
@keyframes awkFade{0%{opacity:0}10%{opacity:1}76%{opacity:1}100%{opacity:0}}
.awk .rays{position:absolute;width:170vmax;height:170vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,160,.16) 0deg 3deg,rgba(255,226,160,0) 3deg 12deg);
  animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.awk .big{position:relative;font-family:var(--serif);font-weight:800;font-size:clamp(66px,23vw,124px);
  letter-spacing:.22em;color:#FFF6DC;text-shadow:0 0 60px rgba(240,197,80,.8);
  animation:awkKanji 2s cubic-bezier(.2,.8,.2,1) both}
@keyframes awkKanji{0%{opacity:0;transform:scale(1.6);filter:blur(16px)}
  20%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:1;transform:scale(1.05)}}
.awk .who2{position:relative;text-align:center;color:#F3E3B4;letter-spacing:.2em;font-size:14px;margin-top:8px}
.shockwave{position:fixed;inset:0;z-index:79;pointer-events:none;display:none;background:rgba(255,244,214,.55)}
.shockwave.on{display:block;animation:flashBang .5s ease forwards}
@keyframes flashBang{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;
  transition-duration:.01ms !important}}

.result{text-align:center;padding:7vh 0 0}
.rw{font-family:var(--serif);font-size:40px;letter-spacing:.2em;animation:winIn .9s cubic-bezier(.2,.8,.2,1) both}
.rw.win{color:var(--gold);text-shadow:0 0 40px rgba(240,197,80,.5)}
.rw.lose{color:#A99DBE}
@keyframes winIn{from{opacity:0;transform:scale(.88);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.rname{font-family:var(--serif);font-size:20px;margin-top:14px}
.rs{color:var(--dim);font-size:13px;margin-top:6px}

.status{border-radius:16px;padding:13px 14px;font-size:13px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.status.wait{border-color:rgba(240,197,80,.4);color:#F5E3B0;background:rgba(240,197,80,.08)}
.status.ok{border-color:rgba(79,214,200,.4);color:#9DF0E4;background:rgba(79,214,200,.08)}
.status.bad{border-color:rgba(242,86,106,.4);color:#FFA9B6;background:rgba(242,86,106,.08)}
.word{font-family:var(--serif);font-size:26px;letter-spacing:.24em;text-align:center;padding:8px 0;color:#FFF0C4}

/* ===== 40-forms.css ===== */

.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11.5px;color:var(--dim);letter-spacing:.08em}
input[type=text],input[type=number],select,textarea{
  background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:13px;color:var(--ivory);
  padding:11px 12px;font:inherit;font-size:14px;width:100%}
textarea{min-height:120px;font-size:12.5px;line-height:1.5;border-radius:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pickrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;
  padding:10px 12px;background:rgba(255,255,255,.04);font-size:13px}
.pickrow input{width:auto;flex:0 0 auto;accent-color:#E2A92C;transform:scale(1.15)}
.pickrow .pn{flex:1}
.pickrow .pc{font-size:11px;color:#9DF0E4}
.effrow{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.04)}
.effrow .eh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;gap:8px}
.effrow .ed{font-size:11.5px;color:var(--dim);margin-top:3px}
.err{color:#FFA9B6;font-size:12.5px}
.meter .mrow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px}
.meter .mrow b{color:var(--ivory);font-weight:700}
.meter .mtrack{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.meter .mfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--jade),var(--gold));
  transition:width .3s ease}
.meter.over .mfill{background:linear-gradient(90deg,#F2566A,#FF8797)}
.meter.over .mrow b{color:#FFA9B6}
.upload{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.upload .hint{font-size:11.5px;color:var(--dim);flex:1;min-width:120px}
.filebtn{display:inline-block;width:auto;padding:11px 14px;font-size:13px;cursor:pointer}
.cropper{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:18px;
  background:rgba(8,5,16,.92);backdrop-filter:blur(8px)}
.cropper.on{display:grid}
.crop-panel{width:100%;max-width:340px;text-align:center}
.crop-head{font-family:var(--serif);font-size:17px;letter-spacing:.08em;margin-bottom:12px}
.crop-box{position:relative;width:280px;height:280px;margin:0 auto;overflow:hidden;border-radius:22px;
  border:2px solid rgba(240,197,80,.75);box-shadow:0 0 0 9999px rgba(8,5,16,.55),0 12px 40px rgba(0,0,0,.6);
  touch-action:none;cursor:grab;background:#0B0813}
.crop-box img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-grid{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 33.3%,rgba(255,255,255,.18) 33.3% 33.6%,transparent 33.6% 66.6%,rgba(255,255,255,.18) 66.6% 66.9%,transparent 66.9%),
             linear-gradient(0deg,transparent 33.3%,rgba(255,255,255,.18) 33.3% 33.6%,transparent 33.6% 66.6%,rgba(255,255,255,.18) 66.6% 66.9%,transparent 66.9%)}
.crop-zoomrow{display:flex;align-items:center;gap:10px;margin:16px 0 14px;font-size:11.5px;color:var(--dim)}
.crop-zoomrow input{accent-color:#E2A92C}
#btn-mute{cursor:pointer}
.editcard{display:flex;gap:12px;align-items:center;border-radius:16px;padding:11px 12px;
  background:rgba(255,255,255,.04);border:1px solid var(--line)}
</style>
</head>
<body>
<div id="bg"></div>
<div class="app">
  <section id="s-title" class="screen on">
    <div class="hero"><div class="ring"></div>
      <h1 class="logo">覚醒</h1>

    </div>

    <div class="title-actions">

      <button class="btn" data-mode="ai"><span class="ic">✦</span>AI対戦<span class="btn-sub">相手と強さを選んで挑む</span></button>

  </section>
  <section id="s-select" class="screen">
    <div class="topbar"><span class="tt" id="select-title">キャラクター選択</span><button class="btn btn-ghost" data-go="title" style="width:auto">戻る</button></div>

  <section id="s-online" class="screen">
    <div class="topbar"><span class="tt">オンライン対戦</span><button class="btn btn-ghost" id="online-back" style="width:auto">戻る</button></div>
    <p class="note">同じ「あいことば」を入れた2人がつながります。片方が部屋を作り、もう片方が参加してください。</p>
    <div class="h-rule">あいことば</div>

    <div class="h-rule">使うキャラクター</div>

    <div class="tray" id="online-tray"></div>

    <button class="btn btn-gold" id="btn-connect">あいことばでつながる</button>

  <section id="s-roster" class="screen">
    <div class="topbar"><span class="tt">キャラクター</span><button class="btn btn-ghost" data-go="title" style="width:auto">戻る</button></div>

<script>
/* ===== 00-version.js ===== */
"use strict";
const APP_VERSION="1.5";
const NET_PROTOCOL=2;

/* ===== 01-balance.js ===== */
/* =========================================================================
   01. BALANCE — 数値バランスはここに集約する（コード中に直接書かない）
   ========================================================================= */
const BALANCE = {
  defendMultiplier: 0.5,   // 防御時のダメージ倍率
  critMultiplier: 1.5,     // クリティカル倍率
  baseCritRate: 0.05,      // 技側で上書き可能
  accuracyMin: 25,         // 命中率の下限（運ゲー化を防ぐ）
  accuracyMax: 100,        // 命中率の上限
  damageVariance: 0,       // 0 = 乱数なし。0.05 なら ±5%
  minDamage: 1,
  sp: { max: 8, start: 2, regenPerTurn: 2, defendBonus: 1 }, // 技コスト用のリソース
  build: {                 // キャラクター作成時のポイント配分
    budget:480,            // 通常形態に使える合計ポイント
    hpPerPoint:10,         // HP10ごとに1ポイント
    minHp:400, minStat:30,
    awakenBonus:150        // 覚醒形態はATK+DEF+SPDの合計にこれだけ上乗せできる
  },
  ruleset: "competitive",  // 将来 "casual" を追加できるよう保持
  permanentDuration: 99    // これ以上の持続ターンは「永続」として扱う
};

/* ===== 02-skills.js ===== */
/* =========================================================================
   02. SkillData — 技はすべてデータ。エンジンは技IDを知らない。
   formula: standard / fixed / ignoreDef / maxHpRatio / currentHpRatio / spdBased
   ========================================================================= */
const SKILLS = {
  /* --- 共通 --- */
  basic_attack:{id:"basic_attack",name:"攻撃",type:"ATTACK",power:0,accuracy:95,cost:0,priority:0,
    description:"基本の一撃。コストなしで撃てる。",effects:[]},

  /* --- 剣士 通常形態 --- */
  sw_slash:{id:"sw_slash",name:"斬撃",type:"ATTACK",power:40,accuracy:95,cost:1,priority:0,
    description:"踏み込んで斬る。安定した主力。",effects:[]},
  sw_helm:{id:"sw_helm",name:"兜割り",type:"SPECIAL",power:68,accuracy:85,cost:3,priority:0,
    guardBreak:true,defPierce:0.3,
    description:"防御ごと断ち割る。相手の防御を半ば無視する。",effects:[]},
  sw_read:{id:"sw_read",name:"見切り",type:"DEFENSE",power:0,accuracy:100,cost:2,priority:1,
    description:"構えて相手の一撃を待つ。このターン防御が上がり、殴られると斬り返す。",
    effects:[{target:"self",kind:"STAT",stat:"def",mult:1.5,duration:1,name:"見切り",icon:"◆",tone:"good"},
             {target:"self",kind:"COUNTER",ratio:0.5,duration:1,name:"斬り返し",icon:"↩",tone:"good"}]},
  sw_swift:{id:"sw_swift",name:"疾風突き",type:"ATTACK",power:22,accuracy:100,cost:2,priority:2,
    description:"必ず先に届く刺突。威力は低い。",effects:[]},

  /* --- 剣士 覚醒形態 --- */
  sw_issen:{id:"sw_issen",name:"絶刀・一閃",type:"ATTACK",power:95,accuracy:90,cost:3,priority:0,
    guardBreak:true,critRate:0.15,
    description:"防御を意味のないものにする一閃。",effects:[]},
  sw_rensan:{id:"sw_rensan",name:"連斬",type:"ATTACK",power:30,accuracy:90,cost:4,priority:0,hits:3,
    description:"三連撃。命中判定は一回ずつ行う。",effects:[]},
  sw_stance:{id:"sw_stance",name:"無音の構え",type:"DEFENSE",power:0,accuracy:100,cost:2,priority:3,
    description:"呼吸を消す。受けた攻撃をそのまま返す。",
    effects:[{target:"self",kind:"STAT",stat:"def",mult:1.6,duration:1,name:"無音",icon:"◆",tone:"good"},
             {target:"self",kind:"COUNTER",ratio:1.0,duration:1,name:"返し刃",icon:"↩",tone:"good"}]},
  sw_shuen:{id:"sw_shuen",name:"終焉斬",type:"SPECIAL",power:150,accuracy:85,cost:6,priority:0,
    oncePerBattle:true,guardBreak:true,
    description:"残った力を一太刀に乗せる。戦闘中1回だけ。",effects:[]},

  /* --- 魔法使い 通常形態 --- */
  mg_bolt:{id:"mg_bolt",name:"魔力弾",type:"SPECIAL",power:55,accuracy:95,cost:1,priority:0,
    description:"素早く撃ち出す魔力の弾。",effects:[]},
  mg_flame:{id:"mg_flame",name:"炎撃",type:"SPECIAL",power:68,accuracy:85,cost:3,priority:0,

/* ===== 06-store.js ===== */
/* =========================================================================
   04. Store — 追加キャラ／技の保存。localStorage が使えない環境では
       メモリ上に保持し、JSONの書き出し／読み込みで持ち運ぶ。
   ========================================================================= */
const Store = {
  KEY:"awakening_trpg_battle_v1",
  PKEY:"awakening_trpg_prefs_v1",
  mem:null, memPrefs:null,
  prefs:{speed:"fast", muted:false},
  loadPrefs(){
    let raw=null;
    try{ raw=window.localStorage.getItem(this.PKEY); }catch(e){}
    if(!raw) raw=this.memPrefs;
    if(!raw) return;
    try{ Object.assign(this.prefs,JSON.parse(raw)); }catch(e){}
  },
  savePrefs(){
    const raw=JSON.stringify(this.prefs);
    this.memPrefs=raw;
    try{ window.localStorage.setItem(this.PKEY,raw); }catch(e){}
  },
  load(){
    let raw=null;
    try{ raw = window.localStorage.getItem(this.KEY); }catch(e){ raw=null; }
    if(!raw) raw=this.mem;
    if(!raw) return;
    try{ this.apply(JSON.parse(raw)); }catch(e){ console.warn("保存データを読めませんでした",e); }
  },
  apply(data){
    if(data.skills) Object.keys(data.skills).forEach(k=>{ SKILLS[k]=data.skills[k]; });
    if(data.characters) Object.keys(data.characters).forEach(k=>{ CHARACTERS[k]=data.characters[k]; });
  },
  save(){
    const custom={skills:{},characters:{}};
    Object.keys(SKILLS).forEach(k=>{ if(SKILLS[k].custom) custom.skills[k]=SKILLS[k]; });
    Object.keys(CHARACTERS).forEach(k=>{ if(CHARACTERS[k].custom) custom.characters[k]=CHARACTERS[k]; });
    const raw=JSON.stringify(custom);
    this.mem=raw;
    try{ window.localStorage.setItem(this.KEY,raw); }catch(e){ /* メモリ保持のみ */ }
  },
  /* 自分で作った分だけを書き出す（元から入っているキャラと技はアプリ側にある） */
  exportData(){
    const out={format:"awakening-battle", version:1,
      exportedAt:new Date().toISOString(), characters:{}, skills:{}};
    Object.keys(CHARACTERS).forEach(k=>{ if(CHARACTERS[k].custom) out.characters[k]=CHARACTERS[k]; });
    Object.keys(SKILLS).forEach(k=>{ if(SKILLS[k].custom) out.skills[k]=SKILLS[k]; });
    return out;
  },
  exportAll(){ return JSON.stringify(this.exportData(),null,2); },

  /* 読み込み。件数を返し、壊れたデータは弾く */
  importData(data){
    if(!data||typeof data!=="object") throw new Error("形式が違います");
    const chars=data.characters||{}, skills=data.skills||{};
    let nc=0, ns=0;
    Object.keys(skills).forEach(k=>{
      const s=skills[k];
      if(!s||!s.name||k==="basic_attack") return;
      s.custom=true; s.id=k; SKILLS[k]=s; ns++;
    });
    Object.keys(chars).forEach(k=>{
      const c=chars[k];
      if(!c||!c.name||!c.stats||!Array.isArray(c.skills)) return;
      c.custom=true; c.id=k; CHARACTERS[k]=c; nc++;
    });
    if(!nc&&!ns) throw new Error("読み込めるデータがありませんでした");
    this.save();
    return {characters:nc, skills:ns};
  },

  /* 端末のファイルとして保存する */
  fileName(){
    const d=new Date(), p=n=>String(n).padStart(2,"0");
    return `覚醒_キャラクター_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  },
  download(){
    const json=JSON.stringify(this.exportData(),null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=this.fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    return json.length;
  }
};

/* ===== 07-effects.js ===== */
/* =========================================================================
   05. Effects — 状態効果の共通システム
   kind: STAT / DOT / REGEN / STUN / COUNTER / SP
   ========================================================================= */
const Effects = {
  /* かけたターンを記録し、そのターンは持続ターンを減らさない。
     ただし duration=1 の効果は「このターンだけ」の構えなので、その場で切れる。 */
  apply(fighter, def, turn){
    if(def.kind==="SP"){ fighter.sp=Math.min(BALANCE.sp.max, fighter.sp+(def.value||0)); return null; }
    const e={
      id:def.name+"_"+Math.random().toString(36).slice(2,7),
      name:def.name||"効果", kind:def.kind, stat:def.stat||null,
      mult:def.mult!=null?def.mult:1, add:def.add||0,
      value:def.value||0, ratio:def.ratio||0, percent:def.percent||0,
      icon:def.icon||null, tone:def.tone||null,
      duration:def.duration!=null?def.duration:1,
      appliedTurn:(turn!=null?turn:-1)
    };
    e.fresh = (e.duration>1);
    // 同名効果は上書き（重ねがけによる無限強化を防ぐ）
    const i=fighter.effects.findIndex(x=>x.name===e.name);
    if(i>=0) fighter.effects[i]=e; else fighter.effects.push(e);
    return e;
  },
  stat(fighter, stat){
    let v=fighter.base[stat]||0;
    fighter.effects.forEach(e=>{ if(e.kind==="STAT"&&e.stat===stat){ v=v*e.mult+e.add; } });
    return Math.max(1, Math.round(v));
  },
  amount(fighter, e){
    return e.percent ? Math.max(1,Math.floor(fighter.maxHp*e.percent/100)) : (e.value||0);
  },
  has(fighter, kind){ return fighter.effects.some(e=>e.kind===kind); },
  accMod(fighter){
    let v=0; fighter.effects.forEach(e=>{ if(e.kind==="ACC") v+=e.value; }); return v;
  },
  remove(fighter, effect){
    const i=fighter.effects.indexOf(effect); if(i>=0) fighter.effects.splice(i,1);
  },
  clear(fighter){ const n=fighter.effects.length; fighter.effects=[]; return n; },
  find(fighter, kind){ return fighter.effects.find(e=>e.kind===kind)||null; },
  isFresh(e, turn){ return e.fresh && e.appliedTurn===turn; },
  tickDurations(fighter, turn){
    fighter.effects.forEach(e=>{
      if(Effects.isFresh(e,turn)){ e.fresh=false; return; }   // かけたターンは減らさない
      e.duration--;
    });
    fighter.effects=fighter.effects.filter(e=>e.duration>0);
  }
};

/* ===== 08-awakening.js ===== */
/* =========================================================================
   06. AwakeningSystem — 覚醒条件の判定・覚醒形態への移行・代償の処理
   ========================================================================= */
const AwakeningSystem = {
  conditionMet(fighter, c){
    switch(c.type){
      case "HP_BELOW":      return fighter.hp <= fighter.maxHp*c.value;
      case "DAMAGE_TAKEN":  return fighter.damageTaken >= c.value;
      case "SKILL_USED":    return (fighter.skillUse[c.skillId]||0) >= c.value;
      case "TURN_REACHED":  return fighter.turnCount >= c.value;
      case "HAS_EFFECT":    return fighter.effects.some(e=>e.name===c.name||e.kind===c.kind);
      default: return false;
    }
  },
  ready(fighter){
    const a=fighter.char.awakening;
    if(!a||!a.enabled) return false;
    const list=a.conditions||[];
    if(!list.length) return false;
    return (a.conditionMode==="ALL") ? list.every(c=>this.conditionMet(fighter,c))
                                     : list.some(c=>this.conditionMet(fighter,c));
  },
  update(fighter, engine){
    if(fighter.awaken.state!=="LOCKED") return;
    if(this.ready(fighter)){
      fighter.awaken.state="AVAILABLE";
      engine.push("sys",`${fighter.name}の覚醒条件を満たした。`);
      engine.push("awaken",`【覚醒可能】${fighter.name}`);
    }
  },
  awaken(fighter, engine){
    const a=fighter.char.awakening, form=a.form||{};
    fighter.form="AWAKENED";
    fighter.formName=a.name||"覚醒形態";
    // ステータス変更（HPは引き継ぐ。最大HPを変える形態も設定可能）
    if(form.stats){
      Object.keys(form.stats).forEach(k=>{
        if(k==="hp"){ const d=form.stats.hp-fighter.maxHp; fighter.maxHp=form.stats.hp; fighter.hp=Math.min(fighter.maxHp,fighter.hp+Math.max(0,d)); }
        else fighter.base[k]=form.stats[k];
      });
    }
    // 技セットを丸ごと差し替える
    if(form.skills&&form.skills.length) fighter.skills=form.skills.slice();
    (form.effects||[]).forEach(e=>Effects.apply(fighter,e,engine.turn));
    fighter.awaken.state="ACTIVE";
    fighter.awaken.used=true;
    fighter.awaken.turnsLeft=a.duration||0;
    fighter.awaken.startTurn=engine.turn;
    engine.push("awaken",`【AWAKENING】${fighter.name}が${fighter.formName}へ移行した！`,fighter.side);
    if(a.cost&&a.cost.label) engine.push("sys",`代償：${a.cost.label}`);
  },
  endTurn(fighter, engine){
    if(fighter.awaken.state!=="ACTIVE") return;
    // 覚醒したそのターンは、持続ターンもHPの代償も進まない
    if(fighter.awaken.startTurn===engine.turn) return;
    const a=fighter.char.awakening;
    let drain=(a.cost&&a.cost.hpPerTurn)||0;
    const pc=a.cost&&a.cost.hpPercentPerTurn;
    if(pc){
      const pct=pc.minPercent+engine.rng()*(pc.maxPercent-pc.minPercent);
      drain=Math.max(1,Math.floor(fighter.maxHp*pct/100));
    }
    if(drain>0&&fighter.hp>0){
      fighter.hp=Math.max(0,fighter.hp-drain);
      engine.push("dmg",`${fighter.name}は覚醒の代償で${drain}ダメージ！`);
      engine.checkDeath(fighter);
    }
    if(fighter.hp<=0) return;
    if(a.duration>0){
      fighter.awaken.turnsLeft--;
      if(fighter.awaken.turnsLeft<=0) this.revert(fighter,engine);
      else if(fighter.awaken.turnsLeft<=2) engine.push("sys",`${fighter.name}の覚醒はあと${fighter.awaken.turnsLeft}ターン。`);
    }
  },
  revert(fighter, engine){
    const a=fighter.char.awakening;
    fighter.form="NORMAL"; fighter.formName=null;
    fighter.base={...fighter.char.stats};
    fighter.skills=fighter.char.skills.slice();
    fighter.awaken.state = (a.oneTime||fighter.awaken.used) ? "SPENT" : "LOCKED";
    engine.push("sys",`${fighter.name}の覚醒が解けた。`);
    (a.afterEffects||[]).forEach(e=>{
      Effects.apply(fighter,e,engine.turn);
      engine.push("sys",`${fighter.name}は「${e.name}」状態になった。`);
    });
  }
};

/* ===== 09-engine.js ===== */
/* =========================================================================
   07. BattleEngine — ルール・計算・状態管理。UIを一切知らない。
   ========================================================================= */
class BattleEngine{
  constructor(charA, charB, opts){
    this.opts=opts||{};
    this.SK=Object.assign({},SKILLS,this.opts.skills||{});
    this.seed=(this.opts.seed!=null)?this.opts.seed:Math.floor(Math.random()*4294967296);
    this.rng=BattleEngine.makeRng(this.seed);
    this.log=[];
    this.turn=1;
    this.over=false;
    this.winner=null;
    this.pending=[null,null];
    this.fighters=[this.makeFighter(charA,0),this.makeFighter(charB,1)];
    this.push("turn",`ターン ${this.turn}`);
    this.push("sys",`${this.fighters[0].name} と ${this.fighters[1].name} の戦闘を開始する。`);
  }
  static makeRng(seed){
    let a=seed>>>0;
    return function(){
      a=(a+0x6D2B79F5)>>>0;
      let t=Math.imul(a^(a>>>15),1|a);
      t=(t+Math.imul(t^(t>>>7),61|t))^t;
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }
  makeFighter(char, side){
    const f={
      side, char, name:char.name, portrait:char.portrait||"◆", portraitImage:char.portraitImage||null,
      base:{...char.stats}, maxHp:char.stats.hp, hp:char.stats.hp,
      sp:BALANCE.sp.start, effects:[], defending:false,
      skills:char.skills.slice(), usedOnce:{}, skillUse:{}, usedCount:{},
      damageTaken:0, turnCount:0,
      form:"NORMAL", formName:null,
      awaken:{state:(char.awakening&&char.awakening.enabled)?"LOCKED":"NONE",turnsLeft:0,used:false}
    };
    return f;
  }
  /* --- ログ：各行に状態のスナップショットを持たせ、UIが順番に再生できるようにする --- */
  push(kind, text, actor){
    this.log.push({kind,text,turn:this.turn,actor:(actor==null?null:actor),snap:this.snapshot()});
  }
  snapshot(){
    return this.fighters.map(f=>({
      hp:f.hp,maxHp:f.maxHp,sp:f.sp,form:f.form,formName:f.formName,
      awaken:f.awaken.state,defending:f.defending,
      effects:f.effects.map(e=>({name:e.name,kind:e.kind,stat:e.stat,mult:e.mult,duration:e.duration}))
    }));
  }
  foe(side){ return this.fighters[side===0?1:0]; }

  /* --- 選択可能なコマンドを返す（UIはこれを表示するだけ） --- */
  options(side){
    const f=this.fighters[side];
    return {
      canAwaken: f.awaken.state==="AVAILABLE",
      silenced: Effects.has(f,"SILENCE"),
      skills: f.skills.map(id=>{
        const s=this.SK[id]; if(!s) return null;
        let usable=true, reason="";
        if(Effects.has(f,"SILENCE")){ usable=false; reason="沈黙"; }
        if(s.cost>f.sp){ usable=false; reason="SP不足"; }
        if(s.oncePerBattle&&f.usedOnce[id]){ usable=false; reason="使用済み"; }
        if(s.uses){
          const left=s.uses-(f.usedCount[id]||0);
          if(left<=0){ usable=false; reason="使用済み"; } else reason="残り"+left+"回";
        }
        return {skill:s,usable,reason,
          variable:!!s.costMax, maxSpend:this.maxSpend(f,s)};
      }).filter(Boolean)
    };
  }
  submit(side, action){ this.pending[side]=action; }
  bothReady(){ return this.pending[0]&&this.pending[1]; }

  /* --- ターン処理 --- */
  resolveTurn(){
    const from=this.log.length;
    const acts=[0,1].map(s=>({side:s,f:this.fighters[s],a:this.pending[s]}));

    // 防御宣言は行動順に関係なくターン開始時点で有効にする
    acts.forEach(x=>{ x.f.defending = (x.a.type==="DEFEND"); });

    // 行動順：技のpriority → SPD → ランダム
    acts.forEach(x=>{
      x.prio = x.a.type==="AWAKEN" ? 9 : (x.a.type==="SKILL" ? ((this.SK[x.a.skillId]||{}).priority||0) : 0);
      x.spd = Effects.stat(x.f,"spd");
      x.tie = this.rng();
    });
    acts.sort((p,q)=> q.prio-p.prio || q.spd-p.spd || q.tie-p.tie);

    for(const x of acts){
      if(this.over) break;
      if(x.f.hp<=0) continue;
      this.execute(x);
    }

    if(!this.over) this.endOfTurn();
    this.pending=[null,null];
    return this.log.slice(from);
  }

  execute(x){
    const f=x.f, a=x.a, enemy=this.foe(f.side);
    f.turnCount++;
    const stun=Effects.find(f,"STUN");
    if(stun){ this.push("status",`${f.name}は${stun.name}で動けない！`); Effects.remove(f,stun); return; }
    const hold=Effects.find(f,"TIMESTOP")||Effects.find(f,"SLEEP")||Effects.find(f,"PETRIFY");
    if(hold){ this.push("status",`${f.name}は${hold.name}で動けない！`); return; }
    const para=Effects.find(f,"PARALYZE");
    if(para&&this.rng()*100<(para.value||30)){
      this.push("status",`${f.name}は${para.name}で体が動かない！`); return;
    }
    const conf=Effects.find(f,"CONFUSE");
    if(conf&&a.type!=="AWAKEN"&&this.rng()*100<(conf.value||30)){
      const r=this.damage(f,f,this.SK.basic_attack,{selfHit:true});
      this.push("status",`${f.name}は${conf.name}で自分を攻撃した！ ${r.value}ダメージ！`);
      this.checkDeath(f);
      return;
    }

    if(a.type==="AWAKEN"){ AwakeningSystem.awaken(f,this); return; }
    if(a.type==="DEFEND"){
      f.sp=Math.min(BALANCE.sp.max,f.sp+BALANCE.sp.defendBonus);
      this.push("sys",`${f.name}は身を固めた。`,f.side);
      return;
    }
    const raw = a.type==="ATTACK" ? this.SK.basic_attack : this.SK[a.skillId];
    if(!raw) return;
    const spend = raw.costMax
      ? Math.max(raw.cost||0, Math.min(a.spend!=null?a.spend:this.maxSpend(f,raw), this.maxSpend(f,raw)))
      : (raw.cost||0);
    const skill = BattleEngine.effectiveSkill(raw,spend);
    f.sp-=spend;
    if(raw.oncePerBattle) f.usedOnce[raw.id]=true;
    if(raw.uses) f.usedCount[raw.id]=(f.usedCount[raw.id]||0)+1;
    f.skillUse[raw.id]=(f.skillUse[raw.id]||0)+1;
    f.lastSkillId=raw.id;
    this.push("action",`${f.name}は「${raw.name}」を使用した！${raw.costMax?`（SP${spend}）`:""}`,f.side);

    // 使用者自身が支払うHPコスト
    if(skill.selfHpCost){
      const c=skill.selfHpCost;
      const pool=(c.of==="max")?f.maxHp:f.hp;
      const pct=c.minPercent+this.rng()*(c.maxPercent-c.minPercent);
      const loss=Math.max(1,Math.floor(pool*pct/100));
      f.hp=Math.max(1,f.hp-loss); // 自傷では倒れない
      this.push("dmg",`${f.name}は代償として${loss}のHPを支払った。`);
    }
    // 効果の解除と回復
    if(skill.cleanse){
      const n=Effects.clear(f);
      this.push("sys", n?`${f.name}にかかっていた効果がすべて解除された。`:`${f.name}には解除する効果がなかった。`);
    }
    if(skill.healPercent){
      const block=Effects.find(f,"HEALBLOCK");
      if(block){
        this.push("sys",`${f.name}は「${block.name}」で回復できない！`);
      }else{
        const before=f.hp;
        f.hp=Math.min(f.maxHp,f.hp+Math.floor(f.maxHp*skill.healPercent/100));
        this.push("heal",`${f.name}はHPを${f.hp-before}回復した！`);
      }
    }

    let damaging = (skill.type==="ATTACK"||skill.type==="SPECIAL");
    let anyHit=false;
    // 迎撃効果：相手の攻撃を丸ごと無効化する
    const neg=Effects.find(enemy,"NEGATE");
    if(damaging&&neg){
      Effects.remove(enemy,neg);
      this.push("sys",`${enemy.name}の「${neg.name}」が${f.name}の攻撃を無効化した！`);
      damaging=false;
    }
    if(damaging){
      const hits=skill.hits||1;
      for(let i=0;i<hits;i++){
        if(this.over||enemy.hp<=0) break;
        if(!this.rollHit(f,skill)){ this.push("miss",`${enemy.name}は攻撃をかわした！`); continue; }
        anyHit=true;
        const r=this.damage(f,enemy,skill);
        if(r.crit) this.push("crit",`会心の一撃！`);
        this.push("dmg",`${enemy.name}に${r.value}ダメージ！`);
        this.checkDeath(enemy);
        if(this.over) break;
        this.counter(enemy,f,r.value);
        if(this.over) break;
      }
    }else{
      anyHit=true;
    }

    // 効果の適用：自分向けは常に、相手向けは命中時のみ
    (skill.effects||[]).forEach(e=>{
      if(e.chance!=null&&this.rng()>e.chance){
        if(e.target==="enemy"&&anyHit) this.push("miss",`${enemy.name}には効かなかった。`);
        return;
      }
      const tgt=(e.target==="enemy")?enemy:f;
      if(INSTANT_KINDS.indexOf(e.kind)>=0){
        if(e.target==="enemy"&&(!anyHit||enemy.hp<=0)) return;
        this.instantEffect(tgt,e);
        return;
      }
      if(e.target==="enemy"){
        if(!anyHit||enemy.hp<=0) return;
        Effects.apply(enemy,e,this.turn);
        this.push("status",`${enemy.name}は「${e.name}」状態になった。`);
      }else{
        const applied=Effects.apply(f,e,this.turn);
        this.push("status", applied ? `${f.name}に「${e.name}」の効果。` : `${f.name}はSPを回復した。`);
      }
    });
    if(damaging||a.type==="ATTACK") this.followUp(f,enemy);
  }

  /* 時飛ばし・反転重力のような、付与せずその場で起きる効果 */
  instantEffect(target, def){
    if(def.kind==="TIMESKIP"){
      const n=def.value||2;
      this.push("status",`${target.name}の時間が${n}ターンぶん進んだ！`);
      for(const e of target.effects.slice()){
        if(e.kind==="DOT"){
          const dmg=Effects.amount(target,e)*Math.min(n,e.duration);
          target.hp=Math.max(0,target.hp-dmg); target.damageTaken+=dmg;
          this.push("dmg",`${target.name}は「${e.name}」で${dmg}ダメージ！`);
        }
        e.duration-=n; e.fresh=false;
      }
      target.effects=target.effects.filter(e=>e.duration>0);
      this.checkDeath(target);
      return;
    }
    if(def.kind==="INVERT"){
      const list=target.effects.filter(e=>e.kind==="STAT");
      if(!list.length){ this.push("sys",`${target.name}には反転させる能力変化がなかった。`); return; }
      list.forEach(e=>{ e.mult=Math.round((1/e.mult)*1000)/1000; e.tone=e.mult>=1?"good":"bad"; e.icon=e.mult>=1?"▲":"▽"; });
      this.push("status",`${target.name}の能力変化が反転した！`);
    }
  }
  /* 加速：行動のあとにもう一撃 */
  followUp(f, enemy){
    if(this.over||f.hp<=0||enemy.hp<=0) return;
    const ex=Effects.find(f,"EXTRA");
    if(!ex) return;
    this.push("status",`${f.name}の「${ex.name}」による追撃！`,f.side);
    if(!this.rollHit(f,this.SK.basic_attack)){ this.push("miss",`${enemy.name}はかわした！`); return; }
    const r=this.damage(f,enemy,this.SK.basic_attack);
    if(r.crit) this.push("crit",`会心の一撃！`);
    this.push("dmg",`${enemy.name}に${r.value}ダメージ！`);
    this.checkDeath(enemy);
    if(!this.over) this.counter(enemy,f,r.value);
  }

  rollHit(attacker, skill){
    const raw=(skill.accuracy!=null?skill.accuracy:100)+Effects.accMod(attacker);
    const acc=Math.max(BALANCE.accuracyMin,Math.min(BALANCE.accuracyMax,raw));
    return this.rng()*100 < acc;
  }

  /* --- ダメージ計算：技ごとに計算式を差し替えられる --- */
  damage(attacker, target, skill, opt){
    opt=opt||{};
    const atk=Effects.stat(attacker,"atk");
    const spd=Effects.stat(attacker,"spd");
    const pierceBuff=Effects.find(attacker,"PIERCE");           // {upset} など
    const guardBreak=skill.guardBreak||!!pierceBuff;
    const ignoreBuff=skill.buffPierce||!!pierceBuff;
    // バフ貫通：防御バフは無視するが、デバフはそのまま効く
    const rawDef=ignoreBuff ? Math.min(target.base.def,Effects.stat(target,"def")) : Effects.stat(target,"def");
    const def=Math.round(rawDef*(1-(skill.defPierce||0)));
    const power=skill.power||0;
    let base;
    switch(skill.formula||"standard"){
      case "fixed":           base=power; break;
      case "ignoreDef":       base=atk+power; break;
      case "maxHpRatio":      base=target.maxHp*power/100; break;
      case "currentHpRatio":  base=target.hp*power/100; break;
      case "spdBased":        base=spd+power-def; break;
      default:                base=atk+power-def;
    }
    let critRate=(skill.critRate!=null?skill.critRate:BALANCE.baseCritRate);
    const critEff=Effects.find(attacker,"CRIT");
    if(critEff) critRate+=(critEff.value||0)/100;
    const crit=this.rng()<critRate;
    if(crit) base*=BALANCE.critMultiplier;
    if(target.defending&&!guardBreak) base*=BALANCE.defendMultiplier;
    if(Effects.has(target,"PETRIFY")) base*=0.5;
    if(skill.varyPercent>0) base*=1+(this.rng()*2-1)*Math.min(60,skill.varyPercent)/100;
    if(BALANCE.damageVariance>0){
      base*=1+(this.rng()*2-1)*BALANCE.damageVariance;
    }
    let value=Math.max(BALANCE.minDamage,Math.floor(base));
    // 眠り：殴られれば目を覚ます
    const sl=Effects.find(target,"SLEEP");
    if(sl&&!opt.selfHit){ Effects.remove(target,sl); this.push("status",`${target.name}は目を覚ました！`); }
    // 障壁：HPより先に削れる
    const shield=Effects.find(target,"SHIELD");
    if(shield){
      const absorbed=Math.min(shield.value,value);
      shield.value-=absorbed; value-=absorbed;
      if(absorbed>0) this.push("sys",`${target.name}の「${shield.name}」が${absorbed}を防いだ。`);
      if(shield.value<=0){ Effects.remove(target,shield); this.push("sys",`${target.name}の「${shield.name}」が砕けた。`); }
    }
    // 不屈：倒れる一撃を一度だけ耐える
    const end=Effects.find(target,"ENDURE");
    if(end&&value>=target.hp&&target.hp>1){
      value=target.hp-1;
      Effects.remove(target,end);
      this.push("status",`${target.name}は「${end.name}」で持ちこたえた！`);
    }
    target.hp=Math.max(0,target.hp-value);
    target.damageTaken+=value;
    // 吸収：与えたダメージの一部を自分のHPに変える
    if(skill.drain&&value>0&&!opt.selfHit&&!Effects.has(attacker,"HEALBLOCK")){
      const gain=Math.max(1,Math.floor(value*skill.drain));
      const before=attacker.hp;
      attacker.hp=Math.min(attacker.maxHp,attacker.hp+gain);
      if(attacker.hp>before) this.push("heal",`${attacker.name}は${attacker.hp-before}吸収した！`);
    }
    return {value,crit};
  }

  /* --- 可変SPの技：追加で払ったSPぶん威力と持続を伸ばす --- */
  static effectiveSkill(skill, spend){
    const base=skill.cost||0;
    const extra=Math.max(0,(spend!=null?spend:base)-base);
    if(!extra||(!skill.powerPerSp&&!skill.durationPerSp)) return skill;
    const s2=Object.assign({},skill);
    if(skill.powerPerSp) s2.power=(skill.power||0)+extra*skill.powerPerSp;
    if(skill.durationPerSp&&skill.effects){
      s2.effects=skill.effects.map(e=>Object.assign({},e,{duration:(e.duration||1)+extra*skill.durationPerSp}));
    }
    return s2;
  }
  maxSpend(fighter, skill){
    if(!skill.costMax) return skill.cost||0;
    return Math.max(skill.cost||0, Math.min(skill.costMax, fighter.sp));
  }

  /* --- AIや表示用の期待ダメージ（状態を変えない） --- */
  preview(attacker, target, skill){
    if(!skill||(skill.type!=="ATTACK"&&skill.type!=="SPECIAL")) return 0;
    const atk=Effects.stat(attacker,"atk");
    const spd=Effects.stat(attacker,"spd");
    const pierceBuff=Effects.find(attacker,"PIERCE");
    const ignoreBuff=skill.buffPierce||!!pierceBuff;
    const rawDef=ignoreBuff?Math.min(target.base.def,Effects.stat(target,"def")):Effects.stat(target,"def");
    const def=Math.round(rawDef*(1-(skill.defPierce||0)));
    const power=skill.power||0;
    let base;
    switch(skill.formula||"standard"){
      case "fixed": base=power; break;
      case "ignoreDef": base=atk+power; break;
      case "maxHpRatio": base=target.maxHp*power/100; break;
      case "currentHpRatio": base=target.hp*power/100; break;
      case "spdBased": base=spd+power-def; break;
      default: base=atk+power-def;
    }
    const acc=Math.max(BALANCE.accuracyMin,Math.min(BALANCE.accuracyMax,
      (skill.accuracy!=null?skill.accuracy:100)+Effects.accMod(attacker)));
    return Math.max(BALANCE.minDamage,Math.floor(base))*(skill.hits||1)*acc/100;
  }

  counter(defender, attacker, dmg){
    const c=Effects.find(defender,"COUNTER");
    if(!c||defender.hp<=0) return;
    const value=Math.max(1,Math.floor(dmg*c.ratio));
    attacker.hp=Math.max(0,attacker.hp-value);
    attacker.damageTaken+=value;
    this.push("dmg",`${defender.name}の「${c.name}」！ ${attacker.name}に${value}ダメージ！`);
    this.checkDeath(attacker);
  }

  endOfTurn(){
    // 継続ダメージ・回復
    for(const f of this.fighters){
      if(f.hp<=0) continue;
      for(const e of f.effects.slice()){
        if(Effects.isFresh(e,this.turn)) continue;
        if(e.kind==="DOT"){
          const dmg=Effects.amount(f,e);
          f.hp=Math.max(0,f.hp-dmg); f.damageTaken+=dmg;
          this.push("dmg",`${f.name}は「${e.name}」で${dmg}ダメージ！`);
          this.checkDeath(f); if(this.over) return;
        }else if(e.kind==="REGEN"){
          if(Effects.has(f,"HEALBLOCK")) continue;
          const before=f.hp; f.hp=Math.min(f.maxHp,f.hp+Effects.amount(f,e));
          if(f.hp>before) this.push("heal",`${f.name}は${f.hp-before}回復した。`);
        }
      }
    }
    // 覚醒の代償・持続ターン
    for(const f of this.fighters){ AwakeningSystem.endTurn(f,this); if(this.over) return; }
    // 効果の持続ターン・防御解除・SP回復
    for(const f of this.fighters){
      Effects.tickDurations(f,this.turn);
      f.defending=false;
      f.sp=Math.min(BALANCE.sp.max,f.sp+BALANCE.sp.regenPerTurn);
    }
    // 覚醒条件の確認
    for(const f of this.fighters) AwakeningSystem.update(f,this);
    this.turn++;
    this.push("turn",`ターン ${this.turn}`);
  }

  checkDeath(f){
    if(f.hp>0||this.over) return;
    this.over=true;
    this.winner=this.foe(f.side);
    this.push("sys",`${f.name}は戦闘不能になった。`);
    this.push("win",`${this.winner.name} の勝利`);
  }
}

/* ===== 10-ai.js ===== */
/* =========================================================================
   07b. AI — カスタムマッチ用の思考ルーチン。エンジンの公開情報だけを見る。
   ========================================================================= */
const AI = {
  LEVELS:{
    easy:{label:"ひかえめ",noise:0.55,awaken:0.35,defend:0.9},
    normal:{label:"ふつう",noise:0.20,awaken:0.75,defend:1.0},
    hard:{label:"本気",noise:0.03,awaken:1.0,defend:1.15}
  },
  choose(engine, side, level){
    const cfg=this.LEVELS[level]||this.LEVELS.normal;
    const me=engine.fighters[side], foe=engine.foe(side);
    const o=engine.options(side);
    const hpRate=me.hp/me.maxHp, foeRate=foe.hp/foe.maxHp;
    const cand=[];

    // 覚醒：条件を満たしていて、勝負どころだと判断したら切る
    if(o.canAwaken){
      const worth = hpRate<=0.6 || foeRate<=0.45 || me.char.awakening.duration>=5;
      if(worth && Math.random()<cfg.awaken) return {type:"AWAKEN"};
    }

    // 基本攻撃
    cand.push({action:{type:"ATTACK"},score:engine.preview(me,foe,engine.SK.basic_attack)});

    // 防御：相手の最大火力の半分を受け止める価値 ＋ SP回復
    const foeBest=Math.max(0,...engine.options(foe.side).skills
      .filter(x=>x.usable).map(x=>engine.preview(foe,me,x.skill)),
      engine.preview(foe,me,engine.SK.basic_attack));
    let defScore=foeBest*0.35+18;
    if(me.sp<=1) defScore+=40;
    if(hpRate<0.25) defScore+=30;
    cand.push({action:{type:"DEFEND"},score:defScore*cfg.defend});

    const eff=x=>BattleEngine.effectiveSkill(x.skill,x.maxSpend);
    const myBest=Math.max(engine.preview(me,foe,engine.SK.basic_attack),
      ...o.skills.filter(x=>x.usable).map(x=>engine.preview(me,foe,eff(x))));

    o.skills.forEach(x=>{
      if(!x.usable) return;
      const s=eff(x);
      const damaging=(s.type==="ATTACK"||s.type==="SPECIAL");
      let score=engine.preview(me,foe,s);
      if(damaging&&score>=foe.hp) score+=10000;
      if(s.healPercent){
        const heal=Math.min(me.maxHp-me.hp,me.maxHp*s.healPercent/100);
        score+=heal*(hpRate<0.45?1.7:0.3);
        if(s.cleanse){
          const bad=me.effects.filter(e=>(e.kind==="STAT"&&e.mult<1)||e.kind==="DOT"||e.kind==="ACC").length;
          const good=me.effects.filter(e=>(e.kind==="STAT"&&e.mult>=1)||e.kind==="PIERCE").length;
          score+=bad*50-good*70;
        }
      }
      (s.effects||[]).forEach(e=>{
        const tgt=(e.target==="enemy")?foe:me;
        if(tgt.effects.some(x2=>x2.name===e.name)){ score-=45; return; }
        const ch=(e.chance!=null?e.chance:1);
        const w=v=>{ score+=v*ch; };
        if(e.kind==="STUN"){ w(foeBest*1.1); return; }
        if(e.kind==="TIMESTOP"){ w(foeBest*1.05*Math.max(1,e.duration)); return; }
        if(e.kind==="SLEEP"){ w(foeBest*0.8); return; }
        if(e.kind==="PETRIFY"){ w(foeBest*0.6*Math.max(1,e.duration)); return; }
        if(e.kind==="EXTRA"){ w(myBest*0.55*Math.max(1,e.duration)); return; }
        if(e.kind==="ENDURE"){ w(me.hp*0.25); return; }
        if(e.kind==="TIMESKIP"){
          const good=foe.effects.filter(z=>(z.kind==="STAT"&&z.mult>=1)||z.kind==="PIERCE").length;
          const dots=foe.effects.filter(z=>z.kind==="DOT").length;
          w(good*70+dots*90+20); return;
        }
        if(e.kind==="INVERT"){
          const good=foe.effects.filter(z=>z.kind==="STAT"&&z.mult>=1).length;
          w(good?good*120:10); return;
        }
        if(e.kind==="PARALYZE"){ w(foeBest*(e.value||30)/100*Math.max(1,e.duration)); return; }
        if(e.kind==="SILENCE"){ w(foeBest*0.45*Math.max(1,e.duration)); return; }
        if(e.kind==="CONFUSE"){ w(foeBest*(e.value||30)/120*Math.max(1,e.duration)); return; }
        if(e.kind==="SHIELD"){ w(Math.min(e.value||0,foeBest*Math.max(1,e.duration))*0.7); return; }
        if(e.kind==="HEALBLOCK"){ w(60); return; }
        if(e.kind==="CRIT"){ w(myBest*0.2*Math.max(1,e.duration)); return; }
        if(e.kind==="DOT"&&e.percent){ w(foe.maxHp*e.percent/100*Math.min(e.duration,4)*0.8); return; }
        if(e.kind==="REGEN"){ w((e.percent?me.maxHp*e.percent/100:e.value)*Math.min(e.duration,4)*(hpRate<0.6?1:0.5)); return; }
        if(e.kind==="PIERCE") score+=myBest*0.5;
        else if(e.kind==="NEGATE") score+=foeBest*0.6;
        else if(e.kind==="COUNTER") score+=foeBest*(e.ratio||0.5)*0.8;
        else if(e.kind==="DOT") score+=e.value*Math.min(e.duration,3)*0.8;
        else if(e.kind==="ACC") score+=45;
        else if(e.kind==="STAT"){
          const d=Math.max(1,e.duration);
          if(e.target==="self"){
            if(e.stat==="atk") score+=myBest*(e.mult-1)*d*0.8;
            else if(e.stat==="def") score+=foeBest*(1-1/e.mult)*d*0.7;
            else score+=30*d;
          }else{
            if(e.stat==="atk") score+=foeBest*(1-e.mult)*d*0.8;
            else if(e.stat==="def") score+=myBest*(1/e.mult-1)*d*0.5;
            else score+=28*d;
          }
        }else score+=25;
      });
      if(!damaging) score-=myBest*0.5;                     // 攻撃しないターンの損
      if(me.lastSkillId===s.id&&!damaging) score-=70;      // 同じ構えの繰り返しを避ける
      if(s.drain) score+=engine.preview(me,foe,s)*s.drain*(hpRate<0.6?0.9:0.4);
      if(s.selfHpCost) score-=me.hp*(s.selfHpCost.maxPercent/100)*(hpRate<0.3?1.8:0.6);
      if(s.cost>me.sp-1) score-=10;
      cand.push({action:{type:"SKILL",skillId:x.skill.id,spend:x.maxSpend},score});
    });

    if(Math.random()<cfg.noise){
      return cand[Math.floor(Math.random()*cand.length)].action;
    }
    cand.sort((a,b)=>b.score-a.score);
    return cand[0].action;
  }
};

/* ===== 11-net.js ===== */
/* =========================================================================
   07c. Net — あいことば方式のオンライン対戦（P2P）

   つまずきやすい点をこちらで吸収する設計にしている。
   ・「部屋を作る／参加する」を選ばせない。両者とも同じボタンでよい。
     まず部屋を開こうとし、すでに誰かが開いていたら自動で参加側に回る。
   ・相手が先に押していなくても、見つかるまで自動で探し直す。
   ・携帯回線などP2Pが直接つながらない環境のために中継サーバー(TURN)も使う。
   ・信号サーバーとの一時的な切断では対戦を止めず、裏でつなぎ直す。
   ========================================================================= */
const Net = {
  peer:null, conn:null, pending:null, role:null, word:"", handlers:{},
  closed:true, live:false, joinTries:0, swaps:0, lastSeen:0, pingTimer:null,

  LIB:"https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js",
  ICE:{iceServers:[
    {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},
    {urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443",
           "turn:openrelay.metered.ca:443?transport=tcp"],
     username:"openrelayproject", credential:"openrelayproject"}
  ]},

  loadLib(){
    if(window.Peer) return Promise.resolve();
    if(this._loading) return this._loading;
    this._loading=new Promise((res,rej)=>{
      const sc=document.createElement("script");
      sc.src=this.LIB; sc.onload=()=>res(); sc.onerror=()=>rej(new Error("no-lib"));
      document.head.appendChild(sc);
    });
    return this._loading;
  },
  roomId(word){
    let h=2166136261>>>0;
    const w=String(word).trim().toLowerCase().replace(/\s+/g,"");
    for(const ch of w){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0; }
    return "awkbtl"+NET_PROTOCOL+"-"+h.toString(36);
  },
  fire(name,arg){ const h=this.handlers[name]; if(h) h(arg); },
  status(text,cls){ this.fire("onStatus",{text,cls}); },

  /* ---------- 接続開始（役割は自動で決まる） ---------- */
  start(word, handlers){
    this.close();
    this.handlers=handlers||{};
    this.word=word; this.closed=false; this.live=false;
    this.joinTries=0; this.swaps=0;
    this.status("つなぐ準備をしています…","wait");
    this.loadLib().then(()=>{ if(!this.closed) this.tryHost(); })
      .catch(()=>this.status(this.errorText({type:"no-lib"}),"bad"));
  },
  dropPeer(){
    if(this.pending){ try{ this.pending.close(); }catch(e){} this.pending=null; }
    if(this.peer){ try{ this.peer.removeAllListeners&&this.peer.removeAllListeners(); }catch(e){}
      try{ this.peer.destroy(); }catch(e){} this.peer=null; }
  },
  newPeer(id){
    return new window.Peer(id,{debug:0,config:this.ICE});
  },

  tryHost(){
    if(this.closed) return;
    this.dropPeer();
    this.role="host";
    this.status("あいことばで待ち合わせ中…","wait");
    let p;
    try{ p=this.peer=this.newPeer(this.roomId(this.word)); }
    catch(e){ this.status(this.errorText(e),"bad"); return; }
    p.on("open",()=>{
      if(this.closed||this.role!=="host") return;
      this.fire("onRole","host");
      this.status(`<div class="word">${this.word}</div>このあいことばを相手に伝えてください。相手が同じ言葉で「つながる」を押すと始まります。`,"wait");
    });
    p.on("connection",c=>{
      if(this.closed||this.conn) return;
      this.bind(c);
    });
    p.on("error",e=>this.onPeerError(e));
    p.on("disconnected",()=>this.softReconnect());
  },

  tryJoin(){
    if(this.closed) return;
    this.dropPeer();
    this.role="guest"; this.joinTries=0;
    this.status("相手の部屋をさがしています…","wait");
    let p;
    try{ p=this.peer=this.newPeer(undefined); }
    catch(e){ this.status(this.errorText(e),"bad"); return; }
    p.on("open",()=>{ if(!this.closed&&this.role==="guest") this.attempt(); });
    p.on("error",e=>this.onPeerError(e));
    p.on("disconnected",()=>this.softReconnect());
  },
  attempt(){
    if(this.closed||this.conn||!this.peer) return;
    this.joinTries++;
    let c;
    try{ c=this.peer.connect(this.roomId(this.word),{reliable:true}); }
    catch(e){ this.retryJoin(); return; }
    this.pending=c;
    c.on("open",()=>{
      if(this.closed) return;
      this.pending=null;
      this.fire("onRole","guest");
      this.bind(c);
    });
    c.on("error",()=>{});
    // 一定時間でつながらなければ、つなぎ直す
    setTimeout(()=>{
      if(this.closed||this.conn) return;
      if(this.pending===c){ try{ c.close(); }catch(e){} this.pending=null; this.retryJoin(); }
    },4000);
  },
  retryJoin(){
    if(this.closed||this.conn) return;
    if(this.joinTries<5){
      this.status(`相手の部屋をさがしています…（${this.joinTries}回目）`,"wait");
      setTimeout(()=>this.attempt(),900);
    }else this.swapRole();
  },
  /* 相手も同時に部屋を開こうとしていた場合や、古い部屋が残っていた場合の逃げ道 */
  swapRole(){
    if(this.closed||this.conn) return;
    this.swaps++;
    if(this.swaps>3){
      this.status("相手が見つかりませんでした。二人とも同じあいことばで「つながる」を押しているか確認して、もう一度お試しください。","bad");
      this.dropPeer();
      return;
    }
    if(this.role==="host") this.tryJoin(); else this.tryHost();
  },
  onPeerError(e){
    const t=(e&&e.type)||"";
    if(this.closed) return;
    if(t==="unavailable-id"){ this.tryJoin(); return; }        // 相手がすでに部屋を開いていた
    if(t==="peer-unavailable"){ this.retryJoin(); return; }    // まだ相手が来ていない
    if(t==="network"||t==="socket-error"||t==="server-error"||t==="socket-closed"){
      if(this.live){ this.softReconnect(); return; }           // 対戦中は止めない
      this.status("接続サーバーに届きませんでした。通信環境を確認して、もう一度お試しください。","bad");
      return;
    }
    if(t==="browser-incompatible"){ this.status(this.errorText(e),"bad"); return; }
    if(this.live) return;                                      // 対戦中の細かなエラーは無視する
    this.status(this.errorText(e),"bad");
  },
  softReconnect(){
    if(this.closed||!this.peer) return;
    try{ if(this.peer.disconnected&&!this.peer.destroyed) this.peer.reconnect(); }catch(e){}
  },

  bind(conn){
    this.conn=conn; this.live=true; this.lastSeen=Date.now();
    conn.on("data",d=>{
      this.lastSeen=Date.now();
      if(d&&d.t==="ping"){ this.send({t:"pong"}); return; }
      if(d&&d.t==="pong") return;
      this.fire("onData",d);
    });
    conn.on("close",()=>{ if(!this.closed){ this.live=false; this.fire("onClose"); } });
    conn.on("error",()=>{});
    if(this.pingTimer) clearInterval(this.pingTimer);
    this.pingTimer=setInterval(()=>{
      if(!this.connected()){ return; }
      this.send({t:"ping"});
    },8000);
    this.fire("onConnect",this.role);
  },
  send(obj){
    try{ if(this.conn&&this.conn.open){ this.conn.send(obj); return true; } }catch(e){}
    return false;
  },
  connected(){ return !!(this.conn&&this.conn.open); },
  quiet(){ return this.live && (Date.now()-this.lastSeen)>25000; },
  close(){
    this.closed=true; this.live=false;
    if(this.pingTimer){ clearInterval(this.pingTimer); this.pingTimer=null; }
    if(this.conn){ try{ this.conn.close(); }catch(e){} this.conn=null; }
    this.dropPeer();
    this.role=null;
  },
  errorText(e){
    const t=(e&&e.type)||"";
    if(t==="no-lib") return "通信の部品を読み込めませんでした。インターネットにつながった状態で開いてください。";
    if(t==="browser-incompatible") return "このブラウザはP2P通信に対応していません。Safari・Chrome・Edgeの最新版でお試しください。";
    return "接続に失敗しました。もう一度お試しください。";
  }
};

/* ===== 12-music.js ===== */
/* =========================================================================
   07d. Music — 対戦BGM。音源ファイルを持たず、その場で音を組み立てて鳴らす。
   キャラクターに設定した曲を、相手側の曲として戦闘中に流す。
   ========================================================================= */
const Music = {
  ctx:null, master:null, timer:null, key:null, bar:0, muted:false, audioEl:null,
  pending:null, unlocked:false,

  ready(){
    if(this.ctx) return true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    try{
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=this.muted?0:0.5;
      this.master.connect(this.ctx.destination);
      return true;
    }catch(e){ return false; }
  },
  /* ブラウザは利用者が触れた瞬間でないと音を出させてくれない。
     画面を触ったタイミングでここを通し、待たされていた曲があれば鳴らし直す。 */
  unlock(){
    if(!this.ready()) return false;
    try{
      const b=this.ctx.createBuffer(1,1,22050);
      const src=this.ctx.createBufferSource();
      src.buffer=b; src.connect(this.ctx.destination); src.start(0);
    }catch(e){}
    if(this.ctx.state==="suspended"){
      const p=this.ctx.resume();
      if(p&&p.then) p.then(()=>{ this.unlocked=true; this.resume(); }).catch(()=>{});
    }else{
      this.unlocked=true;
      this.resume();
    }
    return this.ctx.state==="running";
  },
  /* 鳴らせずに待たせていた曲を拾い直す */
  resume(){
    if(this.key||!this.pending) return;
    const p=this.pending;
    this.pending=null;
    this.play(p.key,p.url);
  },
  freq(midi){ return 440*Math.pow(2,(midi-69)/12); },

  /* 1音鳴らす */
  note(midi,at,dur,type,gain){
    const c=this.ctx;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"triangle";
    o.frequency.value=this.freq(midi);
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain),at+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g); g.connect(this.master);
    o.start(at); o.stop(at+dur+0.05);
  },
  hat(at){
    const c=this.ctx, len=0.05;
    const buf=c.createBuffer(1,Math.ceil(c.sampleRate*len),c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=c.createBufferSource(); src.buffer=buf;
    const g=c.createGain(); g.gain.value=0.05;
    const hp=c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000;
    src.connect(hp); hp.connect(g); g.connect(this.master);
    src.start(at);
  },

  /* 1小節ぶんを予約する */
  scheduleBar(p,at){
    const beat=60/p.bpm, bar=beat*4;
    const deg=p.prog[this.bar%p.prog.length];
    const sc=p.scale;
    const chordTone=i=>p.root+sc[(deg+i)%sc.length]+12*Math.floor((deg+i)/sc.length);
    const r=chordTone(0), third=chordTone(2), fifth=chordTone(4);
    // ベース
    for(let i=0;i<4;i++) this.note(r-12,at+beat*i,beat*0.7,"sine",0.16);
    // パッド
    this.note(third+12,at,bar*0.95,p.wave,p.padGain);
    this.note(fifth+12,at,bar*0.95,p.wave,p.padGain*0.8);
    // アルペジオ
    const seq=[0,2,4,2,4,6,4,2];
    for(let i=0;i<8;i++){
      if((this.bar%2)===1&&i%2===1) continue;
      this.note(chordTone(seq[i])+12,at+beat*0.5*i,beat*0.45,p.wave,0.055);
    }
    if(p.hat) for(let i=0;i<8;i++) this.hat(at+beat*0.5*i);
    this.bar++;
    return bar;
  },

  play(bgmKey, customUrl){
    this.stop();
    if(customUrl){
      try{
        this.audioEl=new Audio(customUrl);
        this.audioEl.loop=true; this.audioEl.volume=this.muted?0:0.35;
        const pr=this.audioEl.play();
        if(pr&&pr.catch) pr.catch(()=>{ this.pending={key:bgmKey,url:customUrl}; this.key=null; });
        this.key="custom";
      }catch(e){ this.pending={key:bgmKey,url:customUrl}; }
      return;
    }
    if(!bgmKey||bgmKey==="none"||!BGM[bgmKey]) return;
    if(!this.ready()){ return; }
    const p=BGM[bgmKey];
    const begin=()=>{
      if(this.pending&&this.pending.key===bgmKey) this.pending=null;
      this.key=bgmKey; this.bar=0;
      const loop=()=>{
        if(this.key!==bgmKey) return;
        const len=this.scheduleBar(p,this.ctx.currentTime+0.06);
        this.timer=setTimeout(loop,len*1000);
      };
      loop();
    };
    if(this.ctx.state!=="running"){
      // まだ音を出す許可が下りていないので、次に画面を触ったときに鳴らす
      this.pending={key:bgmKey,url:null};
      const pr=this.ctx.resume?this.ctx.resume():null;
      if(pr&&pr.then) pr.then(()=>{ if(this.ctx.state==="running") begin(); }).catch(()=>{});
      return;
    }
    begin();
  },
  /* いま鳴っているか（鳴らせずに待っている状態と区別する） */
  blocked(){ return !!this.pending && !this.key; },
  stop(){
    this.key=null; this.pending=null;
    if(this.timer){ clearTimeout(this.timer); this.timer=null; }
    if(this.audioEl){ try{ this.audioEl.pause(); }catch(e){} this.audioEl=null; }
  },
  setMuted(m){
    this.muted=m;
    if(!m) this.unlock();
    if(this.master) this.master.gain.value=m?0:0.5;
    if(this.audioEl) this.audioEl.volume=m?0:0.35;
  },
  /* 編集画面の試聴（数秒で止める） */
  preview(key){
    this.play(key);
    if(this.previewTimer) clearTimeout(this.previewTimer);
    this.previewTimer=setTimeout(()=>this.stop(),8000);
  }
};

   08. BattleUI — 表示と入力のみ。ここで戦闘計算はしない。
   ========================================================================= */
const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TYPE_LABEL={ATTACK:"攻撃",DEFENSE:"防御",SPECIAL:"特殊",SUPPORT:"補助"};
const KIND_ICON={DOT:"✹",REGEN:"✚",STUN:"✸",PARALYZE:"⚡",SILENCE:"✖",CONFUSE:"✧",SHIELD:"⛨",
  HEALBLOCK:"⊘",ACC:"◐",CRIT:"✦",COUNTER:"↩",PIERCE:"➶",NEGATE:"⛉",STAT:"◆"};
const STAT_MAX={hp:1600,atk:280,def:150,spd:160};

function effTone(e){
  if(e.tone) return e.tone;
  if(e.kind==="STAT") return e.mult>=1?"good":"bad";
  if(["DOT","STUN","PARALYZE","SILENCE","CONFUSE","HEALBLOCK"].includes(e.kind)) return "bad";
  if(e.kind==="ACC") return (e.value||0)<0?"bad":"good";
  return "good";
}
function effIcon(e){
  if(e.icon) return e.icon;
  if(e.kind==="STAT"){ return e.mult>=1?"▲":"▽"; }
  return KIND_ICON[e.kind]||"◆";
}

const UI = {
  mode:"local", pick:[null,null], slotFocus:0, blind:true, aiLevel:"normal",
  mySide:0, controllers:["local","local"],
  engine:null, chars:[null,null],
  localSides:[], li:0, acted:[false,false], remoteBuf:{}, playing:false,
  netStarted:false, onlinePick:null, sheetMode:null,

  show(id){

  /* ---------- 共通パーツ ---------- */
  avatar(c,size,cls){
    const inner = c.portraitImage

      : esc(c.portrait||"◆");
    return `<div class="av av-${size} ${cls||""}${c.portraitImage?" hasimg":""}">${inner}</div>`;
  },
  previewCard(c){
    if(!c) return `<div class="note">キャラクターを選んでください。</div>`;
    const a=c.awakening&&c.awakening.enabled?c.awakening:null;
    const bars=["hp","atk","def","spd"].map(k=>{

      return `<div class="bar"><span class="bl">${k.toUpperCase()}</span>
        <span class="bt"><span class="bf" style="width:${pct}%"></span></span>
        <span class="bv">${v}</span></div>`;
    }).join("");
    return `<div class="pv-head">${this.avatar(c,"84")}
      <div><div class="pv-name">${esc(c.name)}</div><div class="pv-desc">${esc(c.description||"")}</div></div></div>
      <div class="bars">${bars}</div>
      ${a?`<div class="awk-note"><b>覚醒：${esc(a.name||"")}</b><br>
        条件：${esc((a.conditions||[]).map(x=>x.label).join(" または "))}<br>
        代償：${esc((a.cost&&a.cost.label)||"なし")}</div>`:""}`;
  },
  trayHtml(list,current){
